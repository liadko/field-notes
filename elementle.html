um is a chemical element with symbol Pa and atomic number 91. It is a dense, silvery-gray metal which readily reacts with oxygen, water vapor and inorganic acids. It forms various chemical compounds where protactinium is usually present in the oxidation state +5, but can also assume +4 and even +2 or +3 states."},{"number":92,"symbol":"U","name":"Uranium","category":"actinide","period":7,"group":3,"xpos":6,"ypos":10,"atomic_mass":238.029,"phase":"Solid","density":19.1,"melt_k":1405.3,"boil_k":4404.0,"electronegativity":1.38,"electron_config":"[Rn] 5f3 6d1 7s2","discovered_by":"Martin Heinrich Klaproth","fun_fact":"Fuel for nuclear reactors; named after the planet Uranus.","summary":"Uranium is a chemical element with symbol U and atomic number 92. It is a silvery-white metal in the actinide series of the periodic table. A uranium atom has 92 protons and 92 electrons, of which 6 are valence electrons."},{"number":93,"symbol":"Np","name":"Neptunium","category":"actinide","period":7,"group":3,"xpos":7,"ypos":10,"atomic_mass":237.0,"phase":"Solid","density":20.45,"melt_k":912.0,"boil_k":4447.0,"electronegativity":1.36,"electron_config":"[Rn] 5f4 6d1 7s2","discovered_by":"Edwin McMillan","fun_fact":"The first transuranium element, named after Neptune.","summary":"Neptunium is a chemical element with symbol Np and atomic number 93. A radioactive actinide metal, neptunium is the first transuranic element. Its position in the periodic table just after uranium, named after the planet Uranus, led to it being named after Neptune, the next planet beyond Uranus."},{"number":94,"symbol":"Pu","name":"Plutonium","category":"actinide","period":7,"group":3,"xpos":8,"ypos":10,"atomic_mass":244.0,"phase":"Solid","density":19.816,"melt_k":912.5,"boil_k":3505.0,"electronegativity":1.28,"electron_config":"[Rn] 5f6 7s2","discovered_by":"Glenn T. Seaborg","fun_fact":"Powers some deep-space probes through radioisotope generators.","summary":"Plutonium is a transuranic radioactive chemical element with symbol Pu and atomic number 94. It is an actinide metal of silvery-gray appearance that tarnishes when exposed to air, and forms a dull coating when oxidized. The element normally exhibits six allotropes and four oxidation states."},{"number":95,"symbol":"Am","name":"Americium","category":"actinide","period":7,"group":3,"xpos":9,"ypos":10,"atomic_mass":243.0,"phase":"Solid","density":12.0,"melt_k":1449.0,"boil_k":2880.0,"electronegativity":1.13,"electron_config":"[Rn] 5f7 7s2","discovered_by":"Glenn T. Seaborg","fun_fact":"Found in most household smoke detectors.","summary":"Americium is a radioactive transuranic chemical element with symbol Am and atomic number 95. This member of the actinide series is located in the periodic table under the lanthanide element europium, and thus by analogy was named after the Americas. Americium was first produced in 1944 by the group of Glenn T.Seaborg from Berkeley, California, at the metallurgical laboratory of University of Chicago."},{"number":96,"symbol":"Cm","name":"Curium","category":"actinide","period":7,"group":3,"xpos":10,"ypos":10,"atomic_mass":247.0,"phase":"Solid","density":13.51,"melt_k":1613.0,"boil_k":3383.0,"electronegativity":1.28,"electron_config":"[Rn] 5f7 6d1 7s2","discovered_by":"Glenn T. Seaborg","fun_fact":"Named after Marie and Pierre Curie.","summary":"Curium is a transuranic radioactive chemical element with symbol Cm and atomic number 96. This element of the actinide series was named after Marie and Pierre Curie – both were known for their research on radioactivity. Curium was first intentionally produced and identified in July 1944 by the group of Glenn T. Seaborg at the University of California, Berkeley."},{"number":97,"symbol":"Bk","name":"Berkelium","category":"actinide","period":7,"group":3,"xpos":11,"ypos":10,"atomic_mass":247.0,"phase":"Solid","density":14.78,"melt_k":1259.0,"boil_k":2900.0,"electronegativity":1.3,"electron_config":"[Rn] 5f9 7s2","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"Named after Berkeley, California, where it was made.","summary":"Berkelium is a transuranic radioactive chemical element with symbol Bk and atomic number 97. It is a member of the actinide and transuranium element series. It is named after the city of Berkeley, California, the location of the University of California Radiation Laboratory where it was discovered in December 1949."},{"number":98,"symbol":"Cf","name":"Californium","category":"actinide","period":7,"group":3,"xpos":12,"ypos":10,"atomic_mass":251.0,"phase":"Solid","density":15.1,"melt_k":1173.0,"boil_k":1743.0,"electronegativity":1.3,"electron_config":"[Rn] 5f10 7s2","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"One microgram can emit millions of neutrons per minute.","summary":"Californium is a radioactive metallic chemical element with symbol Cf and atomic number 98. The element was first made in 1950 at the University of California Radiation Laboratory in Berkeley, by bombarding curium with alpha particles (helium-4 ions). It is an actinide element, the sixth transuranium element to be synthesized, and has the second-highest atomic mass of all the elements that have been produced in amounts large enough to see with the unaided eye (after einsteinium)."},{"number":99,"symbol":"Es","name":"Einsteinium","category":"actinide","period":7,"group":3,"xpos":13,"ypos":10,"atomic_mass":252.0,"phase":"Solid","density":8.84,"melt_k":1133.0,"boil_k":1269.0,"electronegativity":1.3,"electron_config":"[Rn] 5f11 7s2","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"First found in the debris of the first hydrogen bomb test.","summary":"Einsteinium is a synthetic element with symbol Es and atomic number 99. It is the seventh transuranic element, and an actinide. Einsteinium was discovered as a component of the debris of the first hydrogen bomb explosion in 1952, and named after Albert Einstein."},{"number":100,"symbol":"Fm","name":"Fermium","category":"actinide","period":7,"group":3,"xpos":14,"ypos":10,"atomic_mass":257.0,"phase":"Solid","density":"","melt_k":1800.0,"boil_k":"","electronegativity":1.3,"electron_config":"[Rn] 5f12 7s2","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"Also found in hydrogen bomb debris; named after Enrico Fermi.","summary":"Fermium is a synthetic element with symbol Fm and atomic number 100. It is a member of the actinide series. It is the heaviest element that can be formed by neutron bombardment of lighter elements, and hence the last element that can be prepared in macroscopic quantities, although pure fermium metal has not yet been prepared."},{"number":101,"symbol":"Md","name":"Mendelevium","category":"actinide","period":7,"group":3,"xpos":15,"ypos":10,"atomic_mass":258.0,"phase":"Solid","density":"","melt_k":1100.0,"boil_k":"","electronegativity":1.3,"electron_config":"[Rn] 5f13 7s2","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"Named after Dmitri Mendeleev, the father of the periodic table.","summary":"Mendelevium is a synthetic element with chemical symbol Md (formerly Mv) and atomic number 101. A metallic radioactive transuranic element in the actinide series, it is the first element that currently cannot be produced in macroscopic quantities through neutron bombardment of lighter elements. It is the antepenultimate actinide and the ninth transuranic element."},{"number":102,"symbol":"No","name":"Nobelium","category":"actinide","period":7,"group":3,"xpos":16,"ypos":10,"atomic_mass":259.0,"phase":"Solid","density":"","melt_k":1100.0,"boil_k":"","electronegativity":1.3,"electron_config":"[Rn] 5f14 7s2","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after Alfred Nobel.","summary":"Nobelium is a synthetic chemical element with symbol No and atomic number 102. It is named in honor of Alfred Nobel, the inventor of dynamite and benefactor of science. A radioactive metal, it is the tenth transuranic element and is the penultimate member of the actinide series."},{"number":103,"symbol":"Lr","name":"Lawrencium","category":"actinide","period":7,"group":3,"xpos":17,"ypos":10,"atomic_mass":266.0,"phase":"Solid","density":"","melt_k":1900.0,"boil_k":"","electronegativity":1.3,"electron_config":"[Rn] 5f14 7s2 7p1","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"Named after Ernest Lawrence, inventor of the cyclotron.","summary":"Lawrencium is a synthetic chemical element with chemical symbol Lr (formerly Lw) and atomic number 103. It is named in honor of Ernest Lawrence, inventor of the cyclotron, a device that was used to discover many artificial radioactive elements. A radioactive metal, lawrencium is the eleventh transuranic element and is also the final member of the actinide series."},{"number":104,"symbol":"Rf","name":"Rutherfordium","category":"transition metal","period":7,"group":4,"xpos":4,"ypos":7,"atomic_mass":267.0,"phase":"Solid","density":23.2,"melt_k":2400.0,"boil_k":5800.0,"electronegativity":"","electron_config":"[Rn] 5f14 6d2 7s2","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after Ernest Rutherford.","summary":"Rutherfordium is a chemical element with symbol Rf and atomic number 104, named in honor of physicist Ernest Rutherford. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 267Rf, has a half-life of approximately 1.3 hours. In the periodic table of the elements, it is a d - block element and the second of the fourth - row transition elements."},{"number":105,"symbol":"Db","name":"Dubnium","category":"transition metal","period":7,"group":5,"xpos":5,"ypos":7,"atomic_mass":268.0,"phase":"Solid","density":29.3,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d3 7s2","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after Dubna, Russia, home of a major nuclear research center.","summary":"Dubnium is a chemical element with symbol Db and atomic number 105. It is named after the town of Dubna in Russia (north of Moscow), where it was first produced. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, dubnium-268, has a half-life of approximately 28 hours."},{"number":106,"symbol":"Sg","name":"Seaborgium","category":"transition metal","period":7,"group":6,"xpos":6,"ypos":7,"atomic_mass":269.0,"phase":"Solid","density":35.0,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d4 7s2","discovered_by":"Lawrence Berkeley National Laboratory","fun_fact":"Named after Glenn Seaborg while he was still alive.","summary":"Seaborgium is a synthetic element with symbol Sg and atomic number 106. Its most stable isotope 271Sg has a half-life of 1.9 minutes. A more recently discovered isotope 269Sg has a potentially slightly longer half-life (ca."},{"number":107,"symbol":"Bh","name":"Bohrium","category":"transition metal","period":7,"group":7,"xpos":7,"ypos":7,"atomic_mass":270.0,"phase":"Solid","density":37.1,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d5 7s2","discovered_by":"Gesellschaft für Schwerionenforschung","fun_fact":"Named after Niels Bohr.","summary":"Bohrium is a chemical element with symbol Bh and atomic number 107. It is named after Danish physicist Niels Bohr. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 270Bh, has a half-life of approximately 61 seconds."},{"number":108,"symbol":"Hs","name":"Hassium","category":"transition metal","period":7,"group":8,"xpos":8,"ypos":7,"atomic_mass":269.0,"phase":"Solid","density":40.7,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d6 7s2","discovered_by":"Gesellschaft für Schwerionenforschung","fun_fact":"Named after the German state of Hesse.","summary":"Hassium is a chemical element with symbol Hs and atomic number 108, named after the German state of Hesse. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and radioactive; the most stable known isotope, 269Hs, has a half-life of approximately 9.7 seconds, although an unconfirmed metastable state, 277mHs, may have a longer half-life of about 130 seconds. More than 100 atoms of hassium have been synthesized to date."},{"number":109,"symbol":"Mt","name":"Meitnerium","category":"transition metal","period":7,"group":9,"xpos":9,"ypos":7,"atomic_mass":278.0,"phase":"Solid","density":37.4,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d7 7s2","discovered_by":"Gesellschaft für Schwerionenforschung","fun_fact":"Named after Lise Meitner, co-discoverer of nuclear fission.","summary":"Meitnerium is a chemical element with symbol Mt and atomic number 109. It is an extremely radioactive synthetic element (an element not found in nature that can be created in a laboratory). The most stable known isotope, meitnerium-278, has a half-life of 7.6 seconds."},{"number":110,"symbol":"Ds","name":"Darmstadtium","category":"transition metal","period":7,"group":10,"xpos":10,"ypos":7,"atomic_mass":281.0,"phase":"Solid","density":34.8,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d9 7s1","discovered_by":"Gesellschaft für Schwerionenforschung","fun_fact":"Named after Darmstadt, Germany.","summary":"Darmstadtium is a chemical element with symbol Ds and atomic number 110. It is an extremely radioactive synthetic element. The most stable known isotope, darmstadtium-281, has a half-life of approximately 10 seconds."},{"number":111,"symbol":"Rg","name":"Roentgenium","category":"transition metal","period":7,"group":11,"xpos":11,"ypos":7,"atomic_mass":282.0,"phase":"Solid","density":28.7,"melt_k":"","boil_k":"","electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s1","discovered_by":"Gesellschaft für Schwerionenforschung","fun_fact":"Named after Wilhelm Röntgen, discoverer of X-rays.","summary":"Roentgenium is a chemical element with symbol Rg and atomic number 111. It is an extremely radioactive synthetic element (an element that can be created in a laboratory but is not found in nature); the most stable known isotope, roentgenium-282, has a half-life of 2.1 minutes. Roentgenium was first created in 1994 by the GSI Helmholtz Centre for Heavy Ion Research near Darmstadt, Germany."},{"number":112,"symbol":"Cn","name":"Copernicium","category":"transition metal","period":7,"group":12,"xpos":12,"ypos":7,"atomic_mass":285.0,"phase":"Liquid","density":14.0,"melt_k":283.0,"boil_k":340.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2","discovered_by":"Gesellschaft für Schwerionenforschung","fun_fact":"Named after Nicolaus Copernicus.","summary":"Copernicium is a chemical element with symbol Cn and atomic number 112. It is an extremely radioactive synthetic element that can only be created in a laboratory. The most stable known isotope, copernicium-285, has a half-life of approximately 29 seconds, but it is possible that this copernicium isotope may have a nuclear isomer with a longer half-life, 8.9 min."},{"number":113,"symbol":"Nh","name":"Nihonium","category":"post-transition metal","period":7,"group":13,"xpos":13,"ypos":7,"atomic_mass":286.0,"phase":"Solid","density":16.0,"melt_k":700.0,"boil_k":1430.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2 7p1","discovered_by":"RIKEN","fun_fact":"The first element discovered in Asia, named after Japan (Nihon).","summary":"Nihonium is a chemical element with atomic number 113. It has a symbol Nh. It is a synthetic element (an element that can be created in a laboratory but is not found in nature) and is extremely radioactive; its most stable known isotope, nihonium-286, has a half-life of 20 seconds."},{"number":114,"symbol":"Fl","name":"Flerovium","category":"post-transition metal","period":7,"group":14,"xpos":14,"ypos":7,"atomic_mass":289.0,"phase":"Solid","density":14.0,"melt_k":340.0,"boil_k":420.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2 7p2","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after the Flerov Laboratory in Dubna.","summary":"Flerovium is a superheavy artificial chemical element with symbol Fl and atomic number 114. It is an extremely radioactive synthetic element. The element is named after the Flerov Laboratory of Nuclear Reactions of the Joint Institute for Nuclear Research in Dubna, Russia, where the element was discovered in 1998."},{"number":115,"symbol":"Mc","name":"Moscovium","category":"post-transition metal","period":7,"group":15,"xpos":15,"ypos":7,"atomic_mass":289.0,"phase":"Solid","density":13.5,"melt_k":670.0,"boil_k":1400.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2 7p3","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after the Moscow region.","summary":"Moscovium is the name of a synthetic superheavy element in the periodic table that has the symbol Mc and has the atomic number 115. It is an extremely radioactive element; its most stable known isotope, moscovium-289, has a half-life of only 220 milliseconds. It is also known as eka-bismuth or simply element 115."},{"number":116,"symbol":"Lv","name":"Livermorium","category":"post-transition metal","period":7,"group":16,"xpos":16,"ypos":7,"atomic_mass":293.0,"phase":"Solid","density":12.9,"melt_k":709.0,"boil_k":1085.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2 7p4","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after Lawrence Livermore National Laboratory.","summary":"Livermorium is a synthetic superheavy element with symbol Lv and atomic number 116. It is an extremely radioactive element that has only been created in the laboratory and has not been observed in nature. The element is named after the Lawrence Livermore National Laboratory in the United States, which collaborated with the Joint Institute for Nuclear Research in Dubna, Russia to discover livermorium in 2000."},{"number":117,"symbol":"Ts","name":"Tennessine","category":"halogen","period":7,"group":17,"xpos":17,"ypos":7,"atomic_mass":294.0,"phase":"Solid","density":7.17,"melt_k":723.0,"boil_k":883.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2 7p5","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"Named after Tennessee; discovered in 2010.","summary":"Tennessine is a superheavy artificial chemical element with an atomic number of 117 and a symbol of Ts. Also known as eka-astatine or element 117, it is the second-heaviest known element and penultimate element of the 7th period of the periodic table. As of 2016, fifteen tennessine atoms have been observed: six when it was first synthesized in 2010, seven in 2012, and two in 2014."},{"number":118,"symbol":"Og","name":"Oganesson","category":"noble gas","period":7,"group":18,"xpos":18,"ypos":7,"atomic_mass":294.0,"phase":"Solid","density":4.95,"melt_k":"","boil_k":350.0,"electronegativity":"","electron_config":"*[Rn] 5f14 6d10 7s2 7p6","discovered_by":"Joint Institute for Nuclear Research","fun_fact":"The heaviest known element; only a handful of atoms have ever been made.","summary":"Oganesson is IUPAC's name for the transactinide element with the atomic number 118 and element symbol Og. It is also known as eka-radon or element 118, and on the periodic table of the elements it is a p-block element and the last one of the 7th period. Oganesson is currently the only synthetic member of group 18."}];

/* Same rules as solver.py: "<colors>|<dir>|<cat>", colors g/y/x per guessed letter,
   dir u = secret higher, d = lower, = solved; cat 1 = same category. */
function feedback(gz, sz) {
  const gs = el(gz).symbol.toLowerCase(), ss = el(sz).symbol.toLowerCase();
  const colors = [...gs].map((ch, i) => (i < ss.length && ss[i] === ch ? "g" : "x"));
  // Secret letters not matched in place, including any past the guess's
  // length: guessing C against Sc gives a yellow C.
  const left = [...ss].filter((ch, i) => !(i < gs.length && gs[i] === ch));
  for (let i = 0; i < gs.length; i++) {
    const j = left.indexOf(gs[i]);
    if (colors[i] === "x" && j >= 0) { colors[i] = "y"; left.splice(j, 1); }
  }
  const d = gz === sz ? "=" : sz > gz ? "u" : "d";
  return `${colors.join("")}|${d}|${el(gz).category === el(sz).category ? 1 : 0}`;
}
const FB = Array.from({ length: N + 1 }, (_, g) => g === 0 ? null : Array.from({ length: N + 1 }, (_, s) => s === 0 ? null : feedback(g, s)));
const ALL = ELEMENTS.map(e => e.number);

function consistent(guesses, cands = ALL) {
  // guesses: [{z, fb}]
  return cands.filter(s => guesses.every(g => FB[g.z][s] === g.fb));

function partition(cands, g) {
  const m = new Map();
  for (const s of cands) { if (s === g) continue; const k = FB[g][s]; if (!m.has(k)) m.set(k, []); m.get(k).push(s); }

  const steps = []; let node = STRATS[key].tree, cands = ALL;

    steps.push({ z: node.g, fb, before: cands, after });
    if (node.g === secret) break;
    cands = after; node = node.k[fb];
  }

}

function onTile(z) {
  if (state.mode === "explore") { state.sel = z; }
  else if (state.mode === "play") {
    const g = state.game;
    if (g.picking) { newGame(z); }
    else if (!isWon() && !g.revealed && !g.guesses.some(x => x.z === z)) g.guesses.push({ z, fb: FB[z][g.secret] });
  } else {
    state.strat.secret = z; state.strat.step = null;

}
function isWon() { const g = state.game; return g.guesses.some(x => x.z === g.secret); }

function paintTiles() {
  const m = state.mode;
  let remaining = null, guessed = new Set(), current = null, secret = null, badge = null, won = null;
  if (m === "play") {
    const g = state.game;
    remaining = new Set(consistent(g.guesses));
    g.guesses.forEach(x => guessed.add(x.z));
    if (isWon()) won = g.secret;
    if (g.revealed) secret = g.secret;
  } else if (m === "strategy") {
    const s = state.strat;
    if (s.overlay === "depth") { const d = depthMap(s.key); badge = z => d[z]; }
    else { const o = Object.fromEntries(DATA.openers.map(x => [x.z, x])); badge = z => o[z].avg_free.toFixed(2); }
    if (s.secret) {
      const steps = playOut(s.key, s.secret), k = stepIndex(steps);
      remaining = new Set(steps[k].before);
      steps.slice(0, k).forEach(x => guessed.add(x.z));
      current = steps[k].z; secret = s.secret;
      if (k === steps.length - 1) won = s.secret;
    }
  }
  const q = state.query.trim().toLowerCase();
  for (const e of ELEMENTS) {
    const t = tiles[e.number], z = e.number;
    let dim = false;
    if (m === "explore") {
      if (state.cat && e.category !== state.cat) dim = true;
      if (q && !(e.name.toLowerCase().includes(q) || e.symbol.toLowerCase() === q || String(z) === q)) dim = true;
    }
    t.classList.toggle("dim", dim);
    t.classList.toggle("out", !!remaining && !remaining.has(z) && !guessed.has(z));
    t.classList.toggle("guessed", guessed.has(z));
    t.classList.toggle("current", current === z && won !== z);
    t.classList.toggle("secret", secret === z && won !== z);
    t.classList.toggle("won", won === z);
    t.classList.toggle("sel", m === "explore" && state.sel === z);
    const b = t.querySelector(".badge");
    if (badge) {
      const v = badge(z); b.hidden = false; b.textContent = v;
      b.style.background = badgeColor(state.strat.overlay === "depth" ? Number(v) : Number(v));
      b.style.color = "#0a0d14";
    } else b.hidden = true;

}
function badgeColor(v) {
  if (state.strat.overlay === "depth") {
    return ["", "var(--hit)", "var(--hit)", "#8fc46a", "var(--near)", "var(--bad)", "var(--bad)", "var(--bad)", "var(--bad)"][Math.min(v, 8)];
  }
  const vals = DATA.openers.map(o => o.avg_free), lo = Math.min(...vals), hi = Math.max(...vals);
  const t = (v - lo) / (hi - lo);
  return t < 0.15 ? "var(--hit)" : t < 0.4 ? "#8fc46a" : t < 0.7 ? "var(--near)" : "var(--bad)";
}

/* Hint: follow the best-worst-case tree while the player is on it; otherwise
   pick the guess whose biggest leftover group is smallest. */
function hint() {
  const g = state.game, rem = consistent(g.guesses);
  let node = STRATS.optimal.tree;
  for (const x of g.guesses) { if (!node || node.g !== x.z) { node = null; break; } node = node.k[x.fb]; }
  if (node) return { z: node.g, how: "This is the optimal strategy's move. You are still on its path." };
  if (rem.length === 1) return { z: rem[0], how: "Only one element fits." };
  let best = null;
  for (const z of ALL) {
    const parts = partition(rem, z);
    const inside = rem.includes(z);
    if (!inside && parts.length < 2) continue;
    const worst = parts.length ? parts[0][1].length : 0;
    const spread = parts.reduce((a, p) => a + p[1].length ** 2, 0) / rem.length;
    const score = [worst, spread, inside ? 0 : 1];
    if (!best || score[0] < best.s[0] || (score[0] === best.s[0] && (score[1] < best.s[1] || (score[1] === best.s[1] && score[2] < best.s[2])))) best = { z, s: score };
  }
  return { z: best.z, how: `You left the optimal path, so this is a quick estimate: it leaves at most ${best.s[0]} ${best.s[0] === 1 ? "candidate" : "candidates"} whatever the answer.` };
}

<p><b>{bestWname} ({bestW}) is the best first guess on both counts.</b> It keeps the worst case at {W} and has the lowest average, {bestAavg} guesses. So the two goals pick the same opener here. For {nDiffer} weaker openers they do differ: allowing a 6th guess in rare games lowers their average a little.</p>
<p><b>Tantalum is a strong opener.</b> It also guarantees {taWorst} guesses and averages {taAvg}. That ranks {taRank} of 118 and costs about 0.07 guesses per game against {bestWname}. Its {taClasses} possible answers leave at most {taLargest} candidates: the arrow halves the table, and the category clue splits the transition metals from everything else. {nWorstOpt} of the 118 openers keep the worst case at {W}.</p>
<p><b>You never need to guess an element you have already ruled out.</b> In hard mode, where every guess must still be possible, the best openers do exactly as well. The optimal plays shown here only ever guess elements that could be the answer.</p>
<p><b>A simple rule plays perfectly.</b> Always guess whatever leaves the smallest worst-case group of candidates, and that alone matches the full search: {W} at most, {bestAavg} on average. Binary search on atomic number alone does worse, because it ignores the letter and category clues.</p>
<p class="muted">Method: an exact search over all decision trees, with memoized candidate sets and branch-and-bound pruning. It ranks all 118 openers and takes under three minutes. The best-average search is capped at 6 guesses; a cap of 7 gave identical totals for every opener.</p>

      </div>
      <div class="panel">
        <p class="eyebrow">First guess: ${esc(el(open).name)} splits the 118 into ${parts.length + 1} groups</p>

      </div>
    </div>
    <div class="panel" style="margin-top:20px">
      <p class="eyebrow">Every opener, ranked by average with the best follow-up</p>
      <h3>How good is each first guess?</h3>
      <p class="muted" style="margin:0 0 10px;font-size:var(--step--1)">Bar length is the average number of guesses with the best follow-up. Green bars can still guarantee ${DATA.optimal_worst} guesses; amber bars need ${DATA.optimal_worst + 1} in their worst case. Tantalum ranks ${rankAvg} of 118.</p>
      <div class="scroll-x">${openerChart(byAvg)}</div>
    </div></div>`;
  const vars = { W: DATA.optimal_worst, bestW: bestW.symbol, bestWname: el(bestW.z).name, bestWavg: bestW.avg_at_worst.toFixed(3),
    bestA: bestA.symbol, bestAname: el(bestA.z).name, bestAavg: bestA.avg_free.toFixed(3), bestAworst: bestA.worst,
    taWorst: ta.worst, taAvg: ta.avg_free.toFixed(3), taAvgW: ta.avg_at_worst.toFixed(3), taRank: rankAvg, nWorstOpt, taClasses: ta.groups, taLargest: ta.largest, nDiffer: O.filter(o => o.avg_free < o.avg_at_worst).length };
  research.querySelector(".prose").innerHTML = research.querySelector(".prose").innerHTML.replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m);
}
function openerChart(list) {
  const top = list.slice(0, 40);
  const rowH = 17, left = 112, w = 760, h = top.length * rowH + 26;
  const lo = Math.floor(top[0].avg_free * 10) / 10 - 0.05, hi = Math.ceil(top[top.length - 1].avg_free * 10) / 10;
  const x = v => left + ((v - lo) / (hi - lo)) * (w - left - 60);
  const colors = { 4: "var(--hit)", 5: "var(--hit)", 6: "var(--near)", 7: "var(--bad)" };
  const ticks = []; for (let t = Math.ceil(lo * 10) / 10; t <= hi + 1e-9; t += 0.1) ticks.push(t);
  return `<svg class="opener-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Top 40 openers by average guesses" style="min-width:560px">
    ${ticks.map(t => `<line x1="${x(t)}" x2="${x(t)}" y1="0" y2="${h - 20}" stroke="var(--line)"/><text x="${x(t)}" y="${h - 6}" text-anchor="middle">${t.toFixed(1)}</text>`).join("")}
    ${top.map((o, i) => {
      const y = i * rowH + 2, isTa = o.symbol === "Ta";
      return `<text class="lbl" x="${left - 8}" y="${y + 11}" text-anchor="end" style="${isTa ? "fill:var(--accent)" : ""}">${i + 1}. ${esc(el(o.z).name)}</text>
        <rect x="${left}" y="${y + 2}" width="${Math.max(2, x(o.avg_free) - left)}" height="${rowH - 6}" fill="${colors[o.worst] || "var(--bad)"}" opacity="${isTa ? 1 : 0.75}"/>
        <text x="${x(o.avg_free) + 6}" y="${y + 11}">${o.avg_free.toFixed(3)} · max ${o.worst}</text>`;
    }).join("")}
  </svg>`;
}

function setMode(m) {

window.claude?.hot?.snapshot?.(() => ({ state }));
