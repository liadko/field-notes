<title>Elementle</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one Mendeleev table is the stage for every mode; the empty bay above
   the transition metals holds the live readout, like the key on a wall chart. */
:root {
  color-scheme: dark;
  --bg: #0a0d14;
  --panel: #111622;
  --panel-2: #161d2c;
  --line: #222b3d;
  --fg: #e7eaf2;
  --muted: #8d96aa;
  --faint: #5a6378;
  --accent: #f0c766;
  --hit: #3fb871;
  --near: #d4a72c;
  --miss: #353d50;
  --bad: #e06a5a;

  --c-alkali: #e5675a;
  --c-alkaline: #e89a4f;
  --c-post: #d6bf5a;
  --c-metalloid: #a5c45a;
  --c-nonmetal: #5cc79a;
  --c-noble: #4fc2d0;
  --c-transition: #5b8fe6;
  --c-halogen: #9c84e8;
  --c-lanthanide: #cf7ad6;
  --c-actinide: #e3739f;

  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-3: 2.25rem;
  --step-4: 3.5rem;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--step-0)/1.55 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1240px; margin: 0 auto; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 24px;
  padding: 12px max(16px, env(safe-area-inset-left, 0px));
}
header.top .wrap { display: flex; align-items: center; gap: 16px 28px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font: 700 var(--step-2)/1 var(--font-display); letter-spacing: -0.01em; }
.brand h1 b { color: var(--accent); font-weight: 700; }
.brand span { color: var(--muted); font-size: var(--step--1); }
.tabs { display: flex; gap: 2px; margin-left: auto; background: var(--panel); border: 1px solid var(--line); padding: 3px; border-radius: 3px; }
.tabs button {
  border: 0; background: transparent; padding: 7px 16px; border-radius: 2px;
  font: 600 var(--step-0)/1 var(--font-display); color: var(--muted); letter-spacing: 0.01em;
}
.tabs button[aria-selected="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.tabs button:hover { color: var(--fg); }

/* ---------- toolbar per mode ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; min-height: 40px; }
.toolbar .lead { font: 600 var(--step-1)/1.3 var(--font-display); margin-right: auto; }
.toolbar .lead small { display: block; font: 400 var(--step--1)/1.4 var(--font-body); color: var(--muted); }
.btn {
  border: 1px solid var(--line); background: var(--panel); padding: 8px 14px; border-radius: 3px;
  font-weight: 600; font-size: var(--step--1); letter-spacing: 0.02em;
}
.btn:hover { border-color: var(--faint); background: var(--panel-2); }
.btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: var(--panel); padding: 8px 12px; font-size: var(--step--1); font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
input[type="search"] {
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 8px 12px; width: 220px; max-width: 100%;
}

/* ---------- periodic table ---------- */
.table-scroll { overflow-x: auto; padding-bottom: 6px; }
.ptable {
  display: grid; grid-template-columns: repeat(18, minmax(0, 1fr)); grid-template-rows: repeat(7, auto) 14px auto auto;
  gap: 4px; min-width: 900px; position: relative;
}
.tile {
  --c: var(--faint);
  position: relative; aspect-ratio: 1 / 1.08; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
  background: color-mix(in srgb, var(--c) 13%, var(--panel)); border-radius: 2px; padding: 4px 5px 3px;
  display: flex; flex-direction: column; text-align: left; min-width: 0; overflow: hidden;
  transition: opacity .25s, filter .25s, transform .15s, border-color .15s, background .15s;
}
.tile:hover { border-color: var(--c); background: color-mix(in srgb, var(--c) 24%, var(--panel)); transform: translateY(-1px); }
.tile .z { font: 400 10px/1 var(--font-data); color: var(--muted); }
.tile .sym { font: 700 clamp(15px, 1.6vw, 21px)/1.05 var(--font-display); color: var(--c); margin-top: auto; letter-spacing: -0.01em; }
.tile .nm { font-size: 9.5px; line-height: 1.2; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .badge {
  position: absolute; top: 3px; right: 4px; font: 600 11px/1 var(--font-data); padding: 2px 4px; border-radius: 2px;
  background: var(--bg); color: var(--fg);
}
.tile.out { opacity: .16; filter: grayscale(1); }
.tile.out:hover { opacity: .5; }
.tile.dim { opacity: .28; }
.tile.guessed::after { content: ""; position: absolute; inset: -1px; border: 2px solid var(--fg); border-radius: 2px; pointer-events: none; }
.tile.current { box-shadow: 0 0 0 2px var(--accent), 0 0 18px color-mix(in srgb, var(--accent) 45%, transparent); z-index: 1; }
.tile.secret::before { content: ""; position: absolute; inset: 2px; border: 1px dashed var(--fg); border-radius: 1px; pointer-events: none; }
.tile.sel { box-shadow: 0 0 0 2px var(--fg); z-index: 1; }
.tile.won { box-shadow: 0 0 0 2px var(--hit), 0 0 22px color-mix(in srgb, var(--hit) 55%, transparent); z-index: 1; }
.slot {
  border: 1px dashed var(--line); border-radius: 2px; display: grid; place-items: center; text-align: center;
  font: 400 10px/1.3 var(--font-data); color: var(--faint);
}
.gaprow { grid-column: 1 / -1; }

.cat-alkali.cat-alkali { --c: var(--c-alkali); }
.cat-alkaline.cat-alkaline { --c: var(--c-alkaline); }
.cat-transition.cat-transition { --c: var(--c-transition); }
.cat-post.cat-post { --c: var(--c-post); }
.cat-metalloid.cat-metalloid { --c: var(--c-metalloid); }
.cat-nonmetal.cat-nonmetal { --c: var(--c-nonmetal); }
.cat-halogen.cat-halogen { --c: var(--c-halogen); }
.cat-noble.cat-noble { --c: var(--c-noble); }
.cat-lanthanide.cat-lanthanide { --c: var(--c-lanthanide); }
.cat-actinide.cat-actinide { --c: var(--c-actinide); }

/* the bay above the transition metals */
.bay {
  grid-column: 3 / 13; grid-row: 1 / 4; align-self: stretch; min-width: 0;
  display: flex; flex-direction: column; justify-content: flex-start; padding: 2px 12px 8px; overflow: hidden;
}

/* explore card */
.card { display: grid; grid-template-columns: auto 1fr; gap: 6px 20px; align-items: start; }
.bigtile {
  --c: var(--faint); width: 116px; aspect-ratio: 1 / 1.08; border: 1px solid var(--c); border-radius: 2px;
  background: color-mix(in srgb, var(--c) 18%, var(--panel)); padding: 8px 10px; display: flex; flex-direction: column;
}
.bigtile .z { font: 600 var(--step--1)/1 var(--font-data); color: var(--muted); }
.bigtile .sym { font: 700 46px/1 var(--font-display); color: var(--c); margin-top: auto; }
.bigtile .m { font: 400 11px/1.4 var(--font-data); color: var(--muted); }
.card h2 { margin: 0; font: 700 var(--step-3)/1 var(--font-display); letter-spacing: -0.02em; }
.card .catline { display: flex; gap: 10px; align-items: center; margin-top: 6px; color: var(--muted); font-size: var(--step--1); flex-wrap: wrap; }
.chip { display: inline-block; padding: 2px 8px; border-radius: 2px; font: 600 11px/1.5 var(--font-body); letter-spacing: .04em; text-transform: uppercase;
  color: var(--c); background: color-mix(in srgb, var(--c) 16%, transparent); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.card .fact { grid-column: 1 / -1; font-size: var(--step-0); color: var(--fg); margin: 6px 0 0; max-width: 62ch; }
.card .fact::before { content: "Fun fact  "; font: 600 11px/1 var(--font-body); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }

/* ---------- legend ---------- */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 0; }
.legend button {
  --c: var(--faint); display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 2px;
  background: var(--panel); border: 1px solid var(--line); font-size: var(--step--1); color: var(--fg);
}
.legend button i { width: 12px; height: 12px; background: var(--c); border-radius: 1px; }
.legend button span { color: var(--muted); font-family: var(--font-data); font-size: 11px; }
.legend button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--panel)); }

/* ---------- panels under the table ---------- */
.below { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; margin-top: 22px; }
@media (max-width: 860px) { .below { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 18px 20px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font: 600 var(--step-1)/1.25 var(--font-display); text-wrap: balance; }
.eyebrow { font: 600 11px/1 var(--font-body); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 8px; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 18px; margin: 0; }
.stats div { min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.stats dd { margin: 2px 0 0; font: 500 var(--step-0)/1.35 var(--font-data); overflow-wrap: anywhere; }
.prose { max-width: 66ch; color: var(--fg); }
.prose p { margin: 0 0 12px; }
.prose .muted, .muted { color: var(--muted); }

/* ---------- feedback rows ---------- */
.rows { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 28px auto auto auto minmax(0, 1fr); align-items: center; gap: 6px; }
.row .n { font: 600 var(--step--1)/1 var(--font-data); color: var(--faint); text-align: right; }
.row .letters { display: flex; gap: 3px; }
.fb {
  min-width: 38px; height: 38px; display: grid; place-items: center; border-radius: 2px; padding: 0 8px;
  font: 700 var(--step-1)/1 var(--font-display); background: var(--miss); color: var(--fg);
}
.fb.g { background: var(--hit); color: #06150c; }
.fb.y { background: var(--near); color: #1d1503; }
.fb.num { font: 600 var(--step-0)/1 var(--font-data); gap: 4px; display: flex; min-width: 70px; justify-content: center; }
.fb.num.eq { background: var(--hit); color: #06150c; }
.fb.cat { font: 600 11px/1.15 var(--font-body); letter-spacing: .03em; text-transform: uppercase; min-width: 108px; text-align: center; }
.row .who { font-size: var(--step--1); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .who b { color: var(--fg); font-weight: 600; }
.row.active .n { color: var(--accent); }
.row.click { cursor: pointer; border-radius: 3px; }
.row.click:hover .who b { text-decoration: underline; }
.row.future { opacity: .35; }
@media (max-width: 520px) {
  .row { grid-template-columns: 22px auto auto auto; }
  .row .who { grid-column: 2 / -1; }
  .fb { min-width: 32px; height: 32px; }
  .fb.cat { min-width: 84px; font-size: 10px; }
}

.bay .status { font: 600 var(--step-2)/1.15 var(--font-display); margin: 4px 0 6px; text-wrap: balance; }
.bay .status em { font-style: normal; color: var(--accent); }
.bay .sub { color: var(--muted); font-size: var(--step--1); margin: 0 0 10px; max-width: 60ch; }
.bay .rows .fb { min-width: 30px; height: 30px; font-size: var(--step-0); }
.bay .rows .fb.cat { min-width: 96px; font-size: 10px; }
.bay .rows .fb.num { min-width: 60px; font-size: var(--step--1); }

/* ---------- histogram & bars ---------- */
.hist { display: grid; grid-template-columns: 70px minmax(0, 1fr) 40px; gap: 6px 10px; align-items: center; font-size: var(--step--1); }
.hist .bar { height: 18px; background: var(--miss); border-radius: 1px; position: relative; }
.hist .bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 1px; }
.hist .lab { color: var(--muted); }
.hist .val { font-family: var(--font-data); text-align: right; }

.compare { width: 100%; border-collapse: collapse; font-size: var(--step--1); }
.compare th, .compare td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.compare th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
.compare td.num { font-family: var(--font-data); text-align: right; }
.compare th.num { text-align: right; }
.compare tr.on td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.compare tr.pick { cursor: pointer; }
.compare tr.pick:hover td { background: var(--panel-2); }
.scroll-x { overflow-x: auto; }

.groups { display: flex; flex-direction: column; gap: 8px; }
.group { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px solid var(--line); }
.group:last-child { border-bottom: 0; }
.group .key { display: flex; gap: 3px; align-items: center; }
.group .key .fb { min-width: 24px; height: 24px; font-size: 12px; padding: 0 5px; }
.group .key .fb.num { min-width: 30px; }
.group .key .fb.cat { min-width: 24px; font-size: 10px; }
.group .members { display: flex; flex-wrap: wrap; gap: 3px; }
.mini {
  --c: var(--faint); font: 600 12px/1 var(--font-display); color: var(--c); padding: 4px 5px; min-width: 26px; text-align: center;
  background: color-mix(in srgb, var(--c) 14%, var(--panel)); border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); border-radius: 2px;
}
button.mini:hover { border-color: var(--c); }
.count { font: 600 11px/1 var(--font-data); color: var(--muted); margin-left: 6px; align-self: center; }

.steps { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 12px 0 0; }

.research { margin-top: 28px; }
.research h2 { font: 700 var(--step-3)/1.05 var(--font-display); margin: 0 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
.research > .wrap-in > p.lede { color: var(--muted); max-width: 66ch; margin: 0 0 20px; font-size: var(--step-1); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; margin-top: 20px; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.opener-chart { display: block; width: 100%; height: auto; }
.opener-chart text { fill: var(--muted); font: 10px var(--font-data); }
.opener-chart .lbl { fill: var(--fg); font: 600 11px var(--font-display); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Element<b>le</b></h1><span>a field guide to the 118 and how to find one fast</span></div>
    <nav class="tabs" role="tablist" aria-label="Mode">
      <button id="tab-explore" role="tab" aria-selected="true" data-mode="explore">Explore</button>
      <button id="tab-play" role="tab" aria-selected="false" data-mode="play">Play</button>
      <button id="tab-strategy" role="tab" aria-selected="false" data-mode="strategy">Strategy</button>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="toolbar" id="toolbar"></div>
  <div class="table-scroll"><div class="ptable" id="ptable"><div class="bay" id="bay"></div></div></div>
  <div class="legend" id="legend"></div>
  <div id="below"></div>
  <section class="research" id="research" hidden></section>
</main>

const ELEMENTS = [{"number":1,"symbol":"H","name":"Hydrogen","category":"reactive nonmetal","period":1,"group":1,"xpos":1,"ypos":1,"atomic_mass":1.008,"phase":"Gas","density":0.08988,"melt_k":13.99,"boil_k":20.271,"electronegativity":2.2,"electron_config":"1s1","discovered_by":"Henry Cavendish","fun_fact":"Makes up about three quarters of all normal matter in the universe.","summary":"Hydrogen is a chemical element with chemical symbol H and atomic number 1. With an atomic weight of 1.00794 u, hydrogen is the lightest element on the periodic table. Its monatomic form (H) is the most abundant chemical substance in the Universe, constituting roughly 75% of all baryonic mass."},{"number":2,"symbol":"He","name":"Helium","category":"noble gas","period":1,"group":18,"xpos":18,"ypos":1,"atomic_mass":4.003,"phase":"Gas","density":0.1786,"melt_k":0.95,"boil_k":4.222,"electronegativity":"","electron_config":"1s2","discovered_by":"Pierre Janssen","fun_fact":"Was found in the Sun's spectrum in 1868, decades before it was found on Earth.","summary":"Helium is a chemical element with symbol He and atomic number 2. It is a colorless, odorless, tasteless, non-toxic, inert, monatomic gas that heads the noble gas group in the periodic table. Its boiling and melting points are the lowest among all the elements."},{"number":3,"symbol":"Li","name":"Lithium","category":"alkali metal","period":2,"group":1,"xpos":1,"ypos":2,"atomic_mass":6.94,"phase":"Solid","density":0.534,"melt_k":453.65,"boil_k":1603.0,"electronegativity":0.98,"electron_config":"[He] 2s1","discovered_by":"Johan August Arfwedson","fun_fact":"So light it floats on water, and soft enough to cut with a knife.","summary":"Lithium (from Greek:λίθος lithos, \"stone\") is a chemical element with the symbol Li and atomic number 3. It is a soft, silver-white metal belonging to the alkali metal group of chemical elements. Under standard conditions it is the lightest metal and the least dense solid element."},{"number":4,"symbol":"Be","name":"Beryllium","category":"alkaline earth metal","period":2,"group":2,"xpos":2,"ypos":2,"atomic_mass":9.012,"phase":"Solid","density":1.85,"melt_k":1560.0,"boil_k":2742.0,"electronegativity":1.57,"electron_config":"[He] 2s2","discovered_by":"Louis Nicolas Vauquelin","fun_fact":"Nearly transparent to X-rays, so it is used for X-ray tube windows.","summary":"Beryllium is a chemical element with symbol Be and atomic number 4. It is created through stellar nucleosynthesis and is a relatively rare element in the universe. It is a divalent element which occurs naturally only in combination with other elements in minerals."},{"number":5,"symbol":"B","name":"Boron","category":"metalloid","period":2,"group":13,"xpos":13,"ypos":2,"atomic_mass":10.81,"phase":"Solid","density":2.08,"melt_k":2349.0,"boil_k":4200.0,"electronegativity":2.04,"electron_config":"[He] 2s2 2p1","discovered_by":"Joseph Louis Gay-Lussac","fun_fact":"Borax, a boron compound, has been used in glazes and cleaning for centuries.","summary":"Boron is a metalloid chemical element with symbol B and atomic number 5. Produced entirely by cosmic ray spallation and supernovae and not by stellar nucleosynthesis, it is a low-abundance element in both the Solar system and the Earth's crust. Boron is concentrated on Earth by the water-solubility of its more common naturally occurring compounds, the borate minerals."},{"number":6,"symbol":"C","name":"Carbon","category":"reactive nonmetal","period":2,"group":14,"xpos":14,"ypos":2,"atomic_mass":12.011,"phase":"Solid","density":1.821,"melt_k":4600.0,"boil_k":"","electronegativity":2.55,"electron_config":"[He] 2s2 2p2","discovered_by":"Ancient Egypt","fun_fact":"Forms more compounds than any other element; it is the backbone of life.","summary":"Carbon (from Latin:carbo \"coal\") is a chemical element with symbol C and atomic number 6. On the periodic table, it is the first (row 2) of six elements in column (group) 14, which have in common the composition of their outer electron shell. It is nonmetallic and tetravalent—making four electrons available to form covalent chemical bonds."},{"number":7,"symbol":"N","name":"Nitrogen","category":"reactive nonmetal","period":2,"group":15,"xpos":15,"ypos":2,"atomic_mass":14.007,"phase":"Gas","density":1.251,"melt_k":63.15,"boil_k":77.355,"electronegativity":3.04,"electron_config":"[He] 2s2 2p3","discovered_by":"Daniel Rutherford","fun_fact":"About 78% of the air you breathe is nitrogen.","summary":"Nitrogen is a chemical element with symbol N and atomic number 7. It is the lightest pnictogen and at room temperature, it is a transparent, odorless diatomic gas. Nitrogen is a common element in the universe, estimated at about seventh in total abundance in the Milky Way and the Solar System."},{"number":8,"symbol":"O","name":"Oxygen","category":"reactive nonmetal","period":2,"group":16,"xpos":16,"ypos":2,"atomic_mass":15.999,"phase":"Gas","density":1.429,"melt_k":54.36,"boil_k":90.188,"electronegativity":3.44,"electron_config":"[He] 2s2 2p4","discovered_by":"Carl Wilhelm Scheele","fun_fact":"The most abundant element in Earth's crust by mass.","summary":"Oxygen is a chemical element with symbol O and atomic number 8. It is a member of the chalcogen group on the periodic table and is a highly reactive nonmetal and oxidizing agent that readily forms compounds (notably oxides) with most elements. By mass, oxygen is the third-most abundant element in the universe, after hydrogen and helium."},{"number":9,"symbol":"F","name":"Fluorine","category":"halogen","period":2,"group":17,"xpos":17,"ypos":2,"atomic_mass":18.998,"phase":"Gas","density":1.696,"melt_k":53.48,"boil_k":85.03,"electronegativity":3.98,"electron_config":"[He] 2s2 2p5","discovered_by":"André-Marie Ampère","fun_fact":"The most electronegative element; it reacts with almost everything.","summary":"Fluorine is a chemical element with symbol F and atomic number 9. It is the lightest halogen and exists as a highly toxic pale yellow diatomic gas at standard conditions. As the most electronegative element, it is extremely reactive:almost all other elements, including some noble gases, form compounds with fluorine."},{"number":10,"symbol":"Ne","name":"Neon","category":"noble gas","period":2,"group":18,"xpos":18,"ypos":2,"atomic_mass":20.18,"phase":"Gas","density":0.9002,"melt_k":24.56,"boil_k":27.104,"electronegativity":"","electron_config":"[He] 2s2 2p6","discovered_by":"Morris Travers","fun_fact":"Glows reddish-orange in a discharge tube, giving neon signs their name.","summary":"Neon is a chemical element with symbol Ne and atomic number 10. It is in group 18 (noble gases) of the periodic table. Neon is a colorless, odorless, inert monatomic gas under standard conditions, with about two-thirds the density of air."},{"number":11,"symbol":"Na","name":"Sodium","category":"alkali metal","period":3,"group":1,"xpos":1,"ypos":3,"atomic_mass":22.99,"phase":"Solid","density":0.968,"melt_k":370.944,"boil_k":1156.09,"electronegativity":0.93,"electron_config":"[Ne] 3s1","discovered_by":"Humphry Davy","fun_fact":"Its symbol Na comes from the Latin natrium.","summary":"Sodium /ˈsoʊdiəm/ is a chemical element with symbol Na (from Ancient Greek Νάτριο) and atomic number 11. It is a soft, silver-white, highly reactive metal. In the Periodic table it is in column 1 (alkali metals), and shares with the other six elements in that column that it has a single electron in its outer shell, which it readily donates, creating a positively charged atom - a cation."},{"number":12,"symbol":"Mg","name":"Magnesium","category":"alkaline earth metal","period":3,"group":2,"xpos":2,"ypos":3,"atomic_mass":24.305,"phase":"Solid","density":1.738,"melt_k":923.0,"boil_k":1363.0,"electronegativity":1.31,"electron_config":"[Ne] 3s2","discovered_by":"Joseph Black","fun_fact":"Burns with a blinding white light, which made it a staple of old camera flashes.","summary":"Magnesium is a chemical element with symbol Mg and atomic number 12. It is a shiny gray solid which bears a close physical resemblance to the other five elements in the second column (Group 2, or alkaline earth metals) of the periodic table:they each have the same electron configuration in their outer electron shell producing a similar crystal structure. Magnesium is the ninth most abundant element in the universe."},{"number":13,"symbol":"Al","name":"Aluminium","category":"post-transition metal","period":3,"group":13,"xpos":13,"ypos":3,"atomic_mass":26.982,"phase":"Solid","density":2.7,"melt_k":933.47,"boil_k":2743.0,"electronegativity":1.61,"electron_config":"[Ne] 3s2 3p1","discovered_by":"","fun_fact":"Was once more precious than gold; the Washington Monument is capped with it.","summary":"Aluminium (or aluminum; see different endings) is a chemical element in the boron group with symbol Al and atomic number 13. It is a silvery-white, soft, nonmagnetic, ductile metal. Aluminium is the third most abundant element (after oxygen and silicon), and the most abundant metal, in the Earth's crust."},{"number":14,"symbol":"Si","name":"Silicon","category":"metalloid","period":3,"group":14,"xpos":14,"ypos":3,"atomic_mass":28.085,"phase":"Solid","density":2.329,"melt_k":1687.0,"boil_k":3538.0,"electronegativity":1.9,"electron_config":"[Ne] 3s2 3p2","discovered_by":"Jöns Jacob Berzelius","fun_fact":"Second most abundant element in Earth's crust, and the heart of computer chips.","summary":"Silicon is a chemical element with symbol Si and atomic number 14. It is a tetravalent metalloid, more reactive than germanium, the metalloid directly below it in the table. Controversy about silicon's character dates to its discovery."},{"number":15,"symbol":"P","name":"Phosphorus","category":"reactive nonmetal","period":3,"group":15,"xpos":15,"ypos":3,"atomic_mass":30.974,"phase":"Solid","density":1.823,"melt_k":317.3,"boil_k":"","electronegativity":2.19,"electron_config":"[Ne] 3s2 3p3","discovered_by":"Hennig Brand","fun_fact":"Discovered in 1669 by an alchemist boiling down urine.","summary":"Phosphorus is a chemical element with symbol P and atomic number 15. As an element, phosphorus exists in two major forms—white phosphorus and red phosphorus—but due to its high reactivity, phosphorus is never found as a free element on Earth. Instead phosphorus-containing minerals are almost always present in their maximally oxidised state, as inorganic phosphate rocks."},{"number":16,"symbol":"S","name":"Sulfur","category":"reactive nonmetal","period":3,"group":16,"xpos":16,"ypos":3,"atomic_mass":32.06,"phase":"Solid","density":2.07,"melt_k":388.36,"boil_k":717.8,"electronegativity":2.58,"electron_config":"[Ne] 3s2 3p4","discovered_by":"Ancient china","fun_fact":"Known in the Bible as brimstone.","summary":"Sulfur or sulphur (see spelling differences) is a chemical element with symbol S and atomic number 16. It is an abundant, multivalent non-metal. Under normal conditions, sulfur atoms form cyclic octatomic molecules with chemical formula S8."},{"number":17,"symbol":"Cl","name":"Chlorine","category":"halogen","period":3,"group":17,"xpos":17,"ypos":3,"atomic_mass":35.45,"phase":"Gas","density":3.2,"melt_k":171.6,"boil_k":239.11,"electronegativity":3.16,"electron_config":"[Ne] 3s2 3p5","discovered_by":"Carl Wilhelm Scheele","fun_fact":"Was used as a chemical weapon in World War I; now it keeps pools clean.","summary":"Chlorine is a chemical element with symbol Cl and atomic number 17. It also has a relative atomic mass of 35.5. Chlorine is in the halogen group (17) and is the second lightest halogen following fluorine."},{"number":18,"symbol":"Ar","name":"Argon","category":"noble gas","period":3,"group":18,"xpos":18,"ypos":3,"atomic_mass":39.948,"phase":"Gas","density":1.784,"melt_k":83.81,"boil_k":87.302,"electronegativity":"","electron_config":"[Ne] 3s2 3p6","discovered_by":"Lord Rayleigh","fun_fact":"Makes up almost 1% of the atmosphere; its name means 'the lazy one'.","summary":"Argon is a chemical element with symbol Ar and atomic number 18. It is in group 18 of the periodic table and is a noble gas. Argon is the third most common gas in the Earth's atmosphere, at 0.934% (9,340 ppmv), making it over twice as abundant as the next most common atmospheric gas, water vapor (which averages about 4000 ppmv, but varies greatly), and 23 times as abundant as the next most common non-condensing atmospheric gas, carbon dioxide (400 ppmv), and more than 500 times as abundant as the next most common noble gas, neon (18 ppmv)."},{"number":19,"symbol":"K","name":"Potassium","category":"alkali metal","period":4,"group":1,"xpos":1,"ypos":4,"atomic_mass":39.098,"phase":"Solid","density":0.862,"melt_k":336.7,"boil_k":1032.0,"electronegativity":0.82,"electron_config":"[Ar] 4s1","discovered_by":"Humphry Davy","fun_fact":"Bananas are famous for it, and they are very slightly radioactive because of it.","summary":"Potassium is a chemical element with symbol K (derived from Neo-Latin, kalium) and atomic number 19. It was first isolated from potash, the ashes of plants, from which its name is derived. In the Periodic table, potassium is one of seven elements in column (group) 1 (alkali metals):they all have a single valence electron in their outer electron shell, which they readily give up to create an atom with a positive charge - a cation, and combine with anions to form salts."},{"number":20,"symbol":"Ca","name":"Calcium","category":"alkaline earth metal","period":4,"group":2,"xpos":2,"ypos":4,"atomic_mass":40.078,"phase":"Solid","density":1.55,"melt_k":1115.0,"boil_k":1757.0,"electronegativity":1.0,"electron_config":"[Ar] 4s2","discovered_by":"Humphry Davy","fun_fact":"The most abundant metal in the human body, mostly in bones and teeth.","summary":"Calcium is a chemical element with symbol Ca and atomic number 20. Calcium is a soft gray alkaline earth metal, fifth-most-abundant element by mass in the Earth's crust. The ion Ca2+ is also the fifth-most-abundant dissolved ion in seawater by both molarity and mass, after sodium, chloride, magnesium, and sulfate."},{"number":21,"symbol":"Sc","name":"Scandium","category":"transition metal","period":4,"group":3,"xpos":3,"ypos":4,"atomic_mass":44.956,"phase":"Solid","density":2.985,"melt_k":1814.0,"boil_k":3109.0,"electronegativity":1.36,"electron_config":"[Ar] 3d1 4s2","discovered_by":"Lars Fredrik Nilson","fun_fact":"Mendeleev predicted it as 'eka-boron' before it was discovered.","summary":"Scandium is a chemical element with symbol Sc and atomic number 21. A silvery-white metallic d-block element, it has historically been sometimes classified as a rare earth element, together with yttrium and the lanthanoids. It was discovered in 1879 by spectral analysis of the minerals euxenite and gadolinite from Scandinavia."},{"number":22,"symbol":"Ti","name":"Titanium","category":"transition metal","period":4,"group":4,"xpos":4,"ypos":4,"atomic_mass":47.867,"phase":"Solid","density":4.506,"melt_k":1941.0,"boil_k":3560.0,"electronegativity":1.54,"electron_config":"[Ar] 3d2 4s2","discovered_by":"William Gregor","fun_fact":"As strong as steel but much lighter; used in jet engines and hip implants.","summary":"Titanium is a chemical element with symbol Ti and atomic number 22. It is a lustrous transition metal with a silver color, low density and high strength. It is highly resistant to corrosion in sea water, aqua regia and chlorine."},{"number":23,"symbol":"V","name":"Vanadium","category":"transition metal","period":4,"group":5,"xpos":5,"ypos":4,"atomic_mass":50.942,"phase":"Solid","density":6.0,"melt_k":2183.0,"boil_k":3680.0,"electronegativity":1.63,"electron_config":"[Ar] 3d3 4s2","discovered_by":"Andrés Manuel del Río","fun_fact":"Named after Vanadís, a Norse goddess of beauty, for its colorful compounds.","summary":"Vanadium is a chemical element with symbol V and atomic number 23. It is a hard, silvery grey, ductile and malleable transition metal. The element is found only in chemically combined form in nature, but once isolated artificially, the formation of an oxide layer stabilizes the free metal somewhat against further oxidation."},{"number":24,"symbol":"Cr","name":"Chromium","category":"transition metal","period":4,"group":6,"xpos":6,"ypos":4,"atomic_mass":51.996,"phase":"Solid","density":7.19,"melt_k":2180.0,"boil_k":2944.0,"electronegativity":1.66,"electron_config":"[Ar] 3d5 4s1","discovered_by":"Louis Nicolas Vauquelin","fun_fact":"Gives rubies their red and emeralds their green.","summary":"Chromium is a chemical element with symbol Cr and atomic number 24. It is the first element in Group 6. It is a steely-gray, lustrous, hard and brittle metal which takes a high polish, resists tarnishing, and has a high melting point."},{"number":25,"symbol":"Mn","name":"Manganese","category":"transition metal","period":4,"group":7,"xpos":7,"ypos":4,"atomic_mass":54.938,"phase":"Solid","density":7.21,"melt_k":1519.0,"boil_k":2334.0,"electronegativity":1.55,"electron_config":"[Ar] 3d5 4s2","discovered_by":"Torbern Olof Bergman","fun_fact":"Essential in steelmaking; most of the world's supply goes into steel.","summary":"Manganese is a chemical element with symbol Mn and atomic number 25. It is not found as a free element in nature; it is often found in combination with iron, and in many minerals. Manganese is a metal with important industrial metal alloy uses, particularly in stainless steels."},{"number":26,"symbol":"Fe","name":"Iron","category":"transition metal","period":4,"group":8,"xpos":8,"ypos":4,"atomic_mass":55.845,"phase":"Solid","density":7.874,"melt_k":1811.0,"boil_k":3134.0,"electronegativity":1.83,"electron_config":"[Ar] 3d6 4s2","discovered_by":"5000 BC","fun_fact":"The most common element on Earth by mass, thanks to the core.","summary":"Iron is a chemical element with symbol Fe (from Latin:ferrum) and atomic number 26. It is a metal in the first transition series. It is by mass the most common element on Earth, forming much of Earth's outer and inner core."},{"number":27,"symbol":"Co","name":"Cobalt","category":"transition metal","period":4,"group":9,"xpos":9,"ypos":4,"atomic_mass":58.933,"phase":"Solid","density":8.9,"melt_k":1768.0,"boil_k":3200.0,"electronegativity":1.88,"electron_config":"[Ar] 3d7 4s2","discovered_by":"Georg Brandt","fun_fact":"Its name comes from kobold, a German goblin blamed for troublesome ores.","summary":"Cobalt is a chemical element with symbol Co and atomic number 27. Like nickel, cobalt in the Earth's crust is found only in chemically combined form, save for small deposits found in alloys of natural meteoric iron. The free element, produced by reductive smelting, is a hard, lustrous, silver-gray metal."},{"number":28,"symbol":"Ni","name":"Nickel","category":"transition metal","period":4,"group":10,"xpos":10,"ypos":4,"atomic_mass":58.693,"phase":"Solid","density":8.908,"melt_k":1728.0,"boil_k":3003.0,"electronegativity":1.91,"electron_config":"[Ar] 3d8 4s2","discovered_by":"Axel Fredrik Cronstedt","fun_fact":"The US 'nickel' coin is actually 75% copper.","summary":"Nickel is a chemical element with symbol Ni and atomic number 28. It is a silvery-white lustrous metal with a slight golden tinge. Nickel belongs to the transition metals and is hard and ductile."},{"number":29,"symbol":"Cu","name":"Copper","category":"transition metal","period":4,"group":11,"xpos":11,"ypos":4,"atomic_mass":63.546,"phase":"Solid","density":8.96,"melt_k":1357.77,"boil_k":2835.0,"electronegativity":1.9,"electron_config":"[Ar] 3d10 4s1","discovered_by":"Middle East","fun_fact":"The Statue of Liberty is copper; its green color is the patina.","summary":"Copper is a chemical element with symbol Cu (from Latin:cuprum) and atomic number 29. It is a soft, malleable and ductile metal with very high thermal and electrical conductivity. A freshly exposed surface of pure copper has a reddish-orange color."},{"number":30,"symbol":"Zn","name":"Zinc","category":"transition metal","period":4,"group":12,"xpos":12,"ypos":4,"atomic_mass":65.382,"phase":"Solid","density":7.14,"melt_k":692.68,"boil_k":1180.0,"electronegativity":1.65,"electron_config":"[Ar] 3d10 4s2","discovered_by":"India","fun_fact":"Galvanizing coats steel with zinc to stop it rusting.","summary":"Zinc, in commerce also spelter, is a chemical element with symbol Zn and atomic number 30. It is the first element of group 12 of the periodic table. In some respects zinc is chemically similar to magnesium:its ion is of similar size and its only common oxidation state is +2."},{"number":31,"symbol":"Ga","name":"Gallium","category":"post-transition metal","period":4,"group":13,"xpos":13,"ypos":4,"atomic_mass":69.723,"phase":"Solid","density":5.91,"melt_k":302.9146,"boil_k":2673.0,"electronegativity":1.81,"electron_config":"[Ar] 3d10 4s2 4p1","discovered_by":"Lecoq de Boisbaudran","fun_fact":"Melts at about 30 °C, so it can melt in your hand.","summary":"Gallium is a chemical element with symbol Ga and atomic number 31. Elemental gallium does not occur in free form in nature, but as the gallium(III) compounds that are in trace amounts in zinc ores and in bauxite. Gallium is a soft, silvery metal, and elemental gallium is a brittle solid at low temperatures, and melts at 29.76 °C (85.57 °F) (slightly above room temperature)."},{"number":32,"symbol":"Ge","name":"Germanium","category":"metalloid","period":4,"group":14,"xpos":14,"ypos":4,"atomic_mass":72.631,"phase":"Solid","density":5.323,"melt_k":1211.4,"boil_k":3106.0,"electronegativity":2.01,"electron_config":"[Ar] 3d10 4s2 4p2","discovered_by":"Clemens Winkler","fun_fact":"Mendeleev predicted it as 'eka-silicon'; it powered early transistors.","summary":"Germanium is a chemical element with symbol Ge and atomic number 32. It is a lustrous, hard, grayish-white metalloid in the carbon group, chemically similar to its group neighbors tin and silicon. Purified germanium is a semiconductor, with an appearance most similar to elemental silicon."},{"number":33,"symbol":"As","name":"Arsenic","category":"metalloid","period":4,"group":15,"xpos":15,"ypos":4,"atomic_mass":74.922,"phase":"Solid","density":5.727,"melt_k":1090.0,"boil_k":"","electronegativity":2.18,"electron_config":"[Ar] 3d10 4s2 4p3","discovered_by":"Bronze Age","fun_fact":"A classic poison of history; also used in some semiconductors.","summary":"Arsenic is a chemical element with symbol As and atomic number 33. Arsenic occurs in many minerals, usually in conjunction with sulfur and metals, and also as a pure elemental crystal. Arsenic is a metalloid."},{"number":34,"symbol":"Se","name":"Selenium","category":"reactive nonmetal","period":4,"group":16,"xpos":16,"ypos":4,"atomic_mass":78.972,"phase":"Solid","density":4.81,"melt_k":494.0,"boil_k":958.0,"electronegativity":2.55,"electron_config":"[Ar] 3d10 4s2 4p4","discovered_by":"Jöns Jakob Berzelius","fun_fact":"Its electrical conductivity rises in light, so it was used in photocopiers.","summary":"Selenium is a chemical element with symbol Se and atomic number 34. It is a nonmetal with properties that are intermediate between those of its periodic table column-adjacent chalcogen elements sulfur and tellurium. It rarely occurs in its elemental state in nature, or as pure ore compounds."},{"number":35,"symbol":"Br","name":"Bromine","category":"halogen","period":4,"group":17,"xpos":17,"ypos":4,"atomic_mass":79.904,"phase":"Liquid","density":3.1028,"melt_k":265.8,"boil_k":332.0,"electronegativity":2.96,"electron_config":"[Ar] 3d10 4s2 4p5","discovered_by":"Antoine Jérôme Balard","fun_fact":"One of only two elements that are liquid at room temperature.","summary":"Bromine (from Ancient Greek:βρῶμος, brómos, meaning \"stench\") is a chemical element with symbol Br, and atomic number 35. It is a halogen. The element was isolated independently by two chemists, Carl Jacob Löwig and Antoine Jerome Balard, in 1825–1826."},{"number":36,"symbol":"Kr","name":"Krypton","category":"noble gas","period":4,"group":18,"xpos":18,"ypos":4,"atomic_mass":83.798,"phase":"Gas","density":3.749,"melt_k":115.78,"boil_k":119.93,"electronegativity":3.0,"electron_config":"[Ar] 3d10 4s2 4p6","discovered_by":"William Ramsay","fun_fact":"Defined the meter from 1960 to 1983 via one of its spectral lines.","summary":"Krypton (from Greek:κρυπτός kryptos \"the hidden one\") is a chemical element with symbol Kr and atomic number 36. It is a member of group 18 (noble gases) elements. A colorless, odorless, tasteless noble gas, krypton occurs in trace amounts in the atmosphere, is isolated by fractionally distilling liquefied air, and is often used with other rare gases in fluorescent lamps."},{"number":37,"symbol":"Rb","name":"Rubidium","category":"alkali metal","period":5,"group":1,"xpos":1,"ypos":5,"atomic_mass":85.468,"phase":"Solid","density":1.532,"melt_k":312.45,"boil_k":961.0,"electronegativity":0.82,"electron_config":"[Kr] 5s1","discovered_by":"Robert Bunsen","fun_fact":"Rubidium atoms keep time in many GPS satellites' clocks.","summary":"Rubidium is a chemical element with symbol Rb and atomic number 37. Rubidium is a soft, silvery-white metallic element of the alkali metal group, with an atomic mass of 85.4678. Elemental rubidium is highly reactive, with properties similar to those of other alkali metals, such as very rapid oxidation in air."},{"number":38,"symbol":"Sr","name":"Strontium","category":"alkaline earth metal","period":5,"group":2,"xpos":2,"ypos":5,"atomic_mass":87.621,"phase":"Solid","density":2.64,"melt_k":1050.0,"boil_k":1650.0,"electronegativity":0.95,"electron_config":"[Kr] 5s2","discovered_by":"William Cruickshank (chemist)","fun_fact":"Gives fireworks their bright red color.","summary":"Strontium is a chemical element with symbol Sr and atomic number 38. An alkaline earth metal, strontium is a soft silver-white or yellowish metallic element that is highly reactive chemically. The metal turns yellow when it is exposed to air."},{"number":39,"symbol":"Y","name":"Yttrium","category":"transition metal","period":5,"group":3,"xpos":3,"ypos":5,"atomic_mass":88.906,"phase":"Solid","density":4.472,"melt_k":1799.0,"boil_k":3203.0,"electronegativity":1.22,"electron_config":"[Kr] 4d1 5s2","discovered_by":"Johan Gadolin","fun_fact":"One of four elements named after the Swedish village of Ytterby.","summary":"Yttrium is a chemical element with symbol Y and atomic number 39. It is a silvery-metallic transition metal chemically similar to the lanthanides and it has often been classified as a \"rare earth element\". Yttrium is almost always found combined with the lanthanides in rare earth minerals and is never found in nature as a free element."},{"number":40,"symbol":"Zr","name":"Zirconium","category":"transition metal","period":5,"group":4,"xpos":4,"ypos":5,"atomic_mass":91.224,"phase":"Solid","density":6.52,"melt_k":2128.0,"boil_k":4650.0,"electronegativity":1.33,"electron_config":"[Kr] 4d2 5s2","discovered_by":"Martin Heinrich Klaproth","fun_fact":"Zirconia is a popular diamond substitute.","summary":"Zirconium is a chemical element with symbol Zr and atomic number 40. The name of zirconium is taken from the name of the mineral zircon, the most important source of zirconium. The word zircon comes from the Persian word zargun زرگون, meaning \"gold-colored\"."},{"number":41,"symbol":"Nb","name":"Niobium","category":"transition metal","period":5,"group":5,"xpos":5,"ypos":5,"atomic_mass":92.906,"phase":"Solid","density":8.57,"melt_k":2750.0,"boil_k":5017.0,"electronegativity":1.6,"electron_config":"[Kr] 4d4 5s1","discovered_by":"Charles Hatchett","fun_fact":"Named after Niobe, daughter of Tantalus, because it is so similar to tantalum.","summary":"Niobium, formerly columbium, is a chemical element with symbol Nb (formerly Cb) and atomic number 41. It is a soft, grey, ductile transition metal, which is often found in the pyrochlore mineral, the main commercial source for niobium, and columbite. The name comes from Greek mythology:Niobe, daughter of Tantalus since it is so similar to tantalum."},{"number":42,"symbol":"Mo","name":"Molybdenum","category":"transition metal","period":5,"group":6,"xpos":6,"ypos":5,"atomic_mass":95.951,"phase":"Solid","density":10.28,"melt_k":2896.0,"boil_k":4912.0,"electronegativity":2.16,"electron_config":"[Kr] 4d5 5s1","discovered_by":"Carl Wilhelm Scheele","fun_fact":"Plants need traces of it to fix nitrogen.","summary":"Molybdenum is a chemical element with symbol Mo and atomic number 42. The name is from Neo-Latin molybdaenum, from Ancient Greek Μόλυβδος molybdos, meaning lead, since its ores were confused with lead ores. Molybdenum minerals have been known throughout history, but the element was discovered (in the sense of differentiating it as a new entity from the mineral salts of other metals) in 1778 by Carl Wilhelm Scheele."},{"number":43,"symbol":"Tc","name":"Technetium","category":"transition metal","period":5,"group":7,"xpos":7,"ypos":5,"atomic_mass":98.0,"phase":"Solid","density":11.0,"melt_k":2430.0,"boil_k":4538.0,"electronegativity":1.9,"electron_config":"[Kr] 4d5 5s2","discovered_by":"Emilio Segrè","fun_fact":"The lightest element with no stable isotopes; first made artificially.","summary":"Technetium (/tɛkˈniːʃiəm/) is a chemical element with symbol Tc and atomic number 43. It is the element with the lowest atomic number in the periodic table that has no stable isotopes:every form of it is radioactive. Nearly all technetium is produced synthetically, and only minute amounts are found in nature."},{"number":44,"symbol":"Ru","name":"Ruthenium","category":"transition metal","period":5,"group":8,"xpos":8,"ypos":5,"atomic_mass":101.072,"phase":"Solid","density":12.45,"melt_k":2607.0,"boil_k":4423.0,"electronegativity":2.2,"electron_config":"[Kr] 4d7 5s1","discovered_by":"Karl Ernst Claus","fun_fact":"A hard, rare platinum-group metal used to toughen platinum alloys.","summary":"Ruthenium is a chemical element with symbol Ru and atomic number 44. It is a rare transition metal belonging to the platinum group of the periodic table. Like the other metals of the platinum group, ruthenium is inert to most other chemicals."},{"number":45,"symbol":"Rh","name":"Rhodium","category":"transition metal","period":5,"group":9,"xpos":9,"ypos":5,"atomic_mass":102.906,"phase":"Solid","density":12.41,"melt_k":2237.0,"boil_k":3968.0,"electronegativity":2.28,"electron_config":"[Kr] 4d8 5s1","discovered_by":"William Hyde Wollaston","fun_fact":"One of the rarest and most valuable precious metals; used in catalytic converters.","summary":"Rhodium is a chemical element with symbol Rh and atomic number 45. It is a rare, silvery-white, hard, and chemically inert transition metal. It is a member of the platinum group."},{"number":46,"symbol":"Pd","name":"Palladium","category":"transition metal","period":5,"group":10,"xpos":10,"ypos":5,"atomic_mass":106.421,"phase":"Solid","density":12.023,"melt_k":1828.05,"boil_k":3236.0,"electronegativity":2.2,"electron_config":"[Kr] 4d10","discovered_by":"William Hyde Wollaston","fun_fact":"Can soak up hundreds of times its own volume of hydrogen.","summary":"Palladium is a chemical element with symbol Pd and atomic number 46. It is a rare and lustrous silvery-white metal discovered in 1803 by William Hyde Wollaston. He named it after the asteroid Pallas, which was itself named after the epithet of the Greek goddess Athena, acquired by her when she slew Pallas."},{"number":47,"symbol":"Ag","name":"Silver","category":"transition metal","period":5,"group":11,"xpos":11,"ypos":5,"atomic_mass":107.868,"phase":"Solid","density":10.49,"melt_k":1234.93,"boil_k":2435.0,"electronegativity":1.93,"electron_config":"[Kr] 4d10 5s1","discovered_by":"unknown, before 5000 BC","fun_fact":"The best electrical conductor of all metals.","summary":"Silver is a chemical element with symbol Ag (Greek:άργυρος árguros, Latin:argentum, both from the Indo-European root *h₂erǵ- for \"grey\" or \"shining\") and atomic number 47. A soft, white, lustrous transition metal, it possesses the highest electrical conductivity, thermal conductivity and reflectivity of any metal. The metal occurs naturally in its pure, free form (native silver), as an alloy with gold and other metals, and in minerals such as argentite and chlorargyrite."},{"number":48,"symbol":"Cd","name":"Cadmium","category":"transition metal","period":5,"group":12,"xpos":12,"ypos":5,"atomic_mass":112.414,"phase":"Solid","density":8.65,"melt_k":594.22,"boil_k":1040.0,"electronegativity":1.69,"electron_config":"[Kr] 4d10 5s2","discovered_by":"Karl Samuel Leberecht Hermann","fun_fact":"Toxic; caused itai-itai disease in Japan.","summary":"Cadmium is a chemical element with symbol Cd and atomic number 48. This soft, bluish-white metal is chemically similar to the two other stable metals in group 12, zinc and mercury. Like zinc, it prefers oxidation state +2 in most of its compounds and like mercury it shows a low melting point compared to transition metals."},{"number":49,"symbol":"In","name":"Indium","category":"post-transition metal","period":5,"group":13,"xpos":13,"ypos":5,"atomic_mass":114.818,"phase":"Solid","density":7.31,"melt_k":429.7485,"boil_k":2345.0,"electronegativity":1.78,"electron_config":"[Kr] 4d10 5s2 5p1","discovered_by":"Ferdinand Reich","fun_fact":"Indium tin oxide makes touchscreens conductive and transparent.","summary":"Indium is a chemical element with symbol In and atomic number 49. It is a post-transition metallic element that is rare in Earth's crust. The metal is very soft, malleable and easily fusible, with a melting point higher than sodium, but lower than lithium or tin."},{"number":50,"symbol":"Sn","name":"Tin","category":"post-transition metal","period":5,"group":14,"xpos":14,"ypos":5,"atomic_mass":118.711,"phase":"Solid","density":7.365,"melt_k":505.08,"boil_k":2875.0,"electronegativity":1.96,"electron_config":"[Kr] 4d10 5s2 5p2","discovered_by":"unknown, before 3500 BC","fun_fact":"Below about 13 °C, white tin slowly crumbles into gray powder ('tin pest').","summary":"Tin is a chemical element with the symbol Sn (for Latin:stannum) and atomic number 50. It is a main group metal in group 14 of the periodic table. Tin shows a chemical similarity to both neighboring group-14 elements, germanium and lead, and has two possible oxidation states, +2 and the slightly more stable +4."},{"number":51,"symbol":"Sb","name":"Antimony","category":"metalloid","period":5,"group":15,"xpos":15,"ypos":5,"atomic_mass":121.76,"phase":"Solid","density":6.697,"melt_k":903.78,"boil_k":1908.0,"electronegativity":2.05,"electron_config":"[Kr] 4d10 5s2 5p3","discovered_by":"unknown, before 3000 BC","fun_fact":"Its sulfide was used as kohl eyeliner in ancient Egypt.","summary":"Antimony is a chemical element with symbol Sb (from Latin:stibium) and atomic number 51. A lustrous gray metalloid, it is found in nature mainly as the sulfide mineral stibnite (Sb2S3). Antimony compounds have been known since ancient times and were used for cosmetics; metallic antimony was also known, but it was erroneously identified as lead upon its discovery."},{"number":52,"symbol":"Te","name":"Tellurium","category":"metalloid","period":5,"group":16,"xpos":16,"ypos":5,"atomic_mass":127.603,"phase":"Solid","density":6.24,"melt_k":722.66,"boil_k":1261.0,"electronegativity":2.1,"electron_config":"[Kr] 4d10 5s2 5p4","discovered_by":"Franz-Joseph Müller von Reichenstein","fun_fact":"Named after Earth (tellus); exposure gives a garlic smell on the breath.","summary":"Tellurium is a chemical element with symbol Te and atomic number 52. It is a brittle, mildly toxic, rare, silver-white metalloid. Tellurium is chemically related to selenium and sulfur."},{"number":53,"symbol":"I","name":"Iodine","category":"halogen","period":5,"group":17,"xpos":17,"ypos":5,"atomic_mass":126.904,"phase":"Solid","density":4.933,"melt_k":386.85,"boil_k":457.4,"electronegativity":2.66,"electron_config":"[Kr] 4d10 5s2 5p5","discovered_by":"Bernard Courtois","fun_fact":"Your thyroid needs it to make hormones; added to table salt for that reason.","summary":"Iodine is a chemical element with symbol I and atomic number 53. The name is from Greek ἰοειδής ioeidēs, meaning violet or purple, due to the color of iodine vapor. Iodine and its compounds are primarily used in nutrition, and industrially in the production of acetic acid and certain polymers."},{"number":54,"symbol":"Xe","name":"Xenon","category":"noble gas","period":5,"group":18,"xpos":18,"ypos":5,"atomic_mass":131.294,"phase":"Gas","density":5.894,"melt_k":161.4,"boil_k":165.051,"electronegativity":2.6,"electron_config":"[Kr] 4d10 5s2 5p6","discovered_by":"William Ramsay","fun_fact":"Used in ion thrusters on spacecraft.","summary":"Xenon is a chemical element with symbol Xe and atomic number 54. It is a colorless, dense, odorless noble gas, that occurs in the Earth's atmosphere in trace amounts. Although generally unreactive, xenon can undergo a few chemical reactions such as the formation of xenon hexafluoroplatinate, the first noble gas compound to be synthesized."},{"number":55,"symbol":"Cs","name":"Cesium","category":"alkali metal","period":6,"group":1,"xpos":1,"ypos":6,"atomic_mass":132.905,"phase":"Solid","density":1.93,"melt_k":301.7,"boil_k":944.0,"electronegativity":0.79,"electron_config":"[Xe] 6s1","discovered_by":"Robert Bunsen","fun_fact":"The second defines time through a cesium atomic transition.","summary":"Caesium or cesium is a chemical element with symbol Cs and atomic number 55. It is a soft, silvery-gold alkali metal with a melting point of 28 °C (82 °F), which makes it one of only five elemental metals that are liquid at or near room temperature. Caesium is an alkali metal and has physical and chemical properties similar to those of rubidium and potassium."},{"number":56,"symbol":"Ba","name":"Barium","category":"alkaline earth metal","period":6,"group":2,"xpos":2,"ypos":6,"atomic_mass":137.328,"phase":"Solid","density":3.51,"melt_k":1000.0,"boil_k":2118.0,"electronegativity":0.89,"electron_config":"[Xe] 6s2","discovered_by":"Carl Wilhelm Scheele","fun_fact":"Barium sulfate makes your gut show up on X-rays.","summary":"Barium is a chemical element with symbol Ba and atomic number 56. It is the fifth element in Group 2, a soft silvery metallic alkaline earth metal. Because of its high chemical reactivity barium is never found in nature as a free element."},{"number":57,"symbol":"La","name":"Lanthanum","category":"lanthanide","period":6,"group":3,"xpos":3,"ypos":9,"atomic_mass":138.905,"phase":"Solid","density":6.162,"melt_k":1193.0,"boil_k":3737.0,"electronegativity":1.1,"electron_config":"[Xe] 5d16s2","discovered_by":"Carl Gustaf Mosander","fun_fact":"Gives the lanthanide series its name.","summary":"Lanthanum is a soft, ductile, silvery-white metallic chemical element with symbol La and atomic number 57. It tarnishes rapidly when exposed to air and is soft enough to be cut with a knife. It gave its name to the lanthanide series, a group of 15 similar elements between lanthanum and lutetium in the periodic table:it is also sometimes considered the first element of the 6th-period transition metals."},{"number":58,"symbol":"Ce","name":"Cerium","category":"lanthanide","period":6,"group":3,"xpos":4,"ypos":9,"atomic_mass":140.116,"phase":"Solid","density":6.77,"melt_k":1068.0,"boil_k":3716.0,"electronegativity":1.12,"electron_config":"[Xe] 4f1 5d1 6s2","discovered_by":"Martin Heinrich Klaproth","fun_fact":"The most abundant rare-earth element; lighter flints contain it.","summary":"Cerium is a chemical element with symbol Ce and atomic number 58. It is a soft, silvery, ductile metal which easily oxidizes in air. Cerium was named after the dwarf planet Ceres (itself named after the Roman goddess of agriculture)."},{"number":59,"symbol":"Pr","name":"Praseodymium","category":"lanthanide","period":6,"group":3,"xpos":5,"ypos":9,"atomic_mass":140.908,"phase":"Solid","density":6.77,"melt_k":1208.0,"boil_k":3403.0,"electronegativity":1.13,"electron_config":"[Xe] 4f3 6s2","discovered_by":"Carl Auer von Welsbach","fun_fact":"Its name means 'green twin', from its green salts.","summary":"Praseodymium is a chemical element with symbol Pr and atomic number 59. Praseodymium is a soft, silvery, malleable and ductile metal in the lanthanide group. It is valued for its magnetic, electrical, chemical, and optical properties."},{"number":60,"symbol":"Nd","name":"Neodymium","category":"lanthanide","period":6,"group":3,"xpos":6,"ypos":9,"atomic_mass":144.242,"phase":"Solid","density":7.01,"melt_k":1297.0,"boil_k":3347.0,"electronegativity":1.14,"electron_config":"[Xe] 4f4 6s2","discovered_by":"Carl Auer von Welsbach","fun_fact":"Neodymium magnets are the strongest permanent magnets widely available.","summary":"Neodymium is a chemical element with symbol Nd and atomic number 60. It is a soft silvery metal that tarnishes in air. Neodymium was discovered in 1885 by the Austrian chemist Carl Auer von Welsbach."},{"number":61,"symbol":"Pm","name":"Promethium","category":"lanthanide","period":6,"group":3,"xpos":7,"ypos":9,"atomic_mass":145.0,"phase":"Solid","density":7.26,"melt_k":1315.0,"boil_k":3273.0,"electronegativity":1.13,"electron_config":"[Xe] 4f5 6s2","discovered_by":"Chien Shiung Wu","fun_fact":"No stable isotopes; essentially absent from Earth's crust.","summary":"Promethium, originally prometheum, is a chemical element with the symbol Pm and atomic number 61. All of its isotopes are radioactive; it is one of only two such elements that are followed in the periodic table by elements with stable forms, a distinction shared with technetium. Chemically, promethium is a lanthanide, which forms salts when combined with other elements."},{"number":62,"symbol":"Sm","name":"Samarium","category":"lanthanide","period":6,"group":3,"xpos":8,"ypos":9,"atomic_mass":150.362,"phase":"Solid","density":7.52,"melt_k":1345.0,"boil_k":2173.0,"electronegativity":1.17,"electron_config":"[Xe] 4f6 6s2","discovered_by":"Lecoq de Boisbaudran","fun_fact":"Samarium-cobalt magnets survive high temperatures.","summary":"Samarium is a chemical element with symbol Sm and atomic number 62. It is a moderately hard silvery metal that readily oxidizes in air. Being a typical member of the lanthanide series, samarium usually assumes the oxidation state +3."},{"number":63,"symbol":"Eu","name":"Europium","category":"lanthanide","period":6,"group":3,"xpos":9,"ypos":9,"atomic_mass":151.964,"phase":"Solid","density":5.264,"melt_k":1099.0,"boil_k":1802.0,"electronegativity":1.2,"electron_config":"[Xe] 4f7 6s2","discovered_by":"Eugène-Anatole Demarçay","fun_fact":"Glows red in euro banknotes under UV light, as an anti-counterfeiting feature.","summary":"Europium is a chemical element with symbol Eu and atomic number 63. It was isolated in 1901 and is named after the continent of Europe. It is a moderately hard, silvery metal which readily oxidizes in air and water."},{"number":64,"symbol":"Gd","name":"Gadolinium","category":"lanthanide","period":6,"group":3,"xpos":10,"ypos":9,"atomic_mass":157.253,"phase":"Solid","density":7.9,"melt_k":1585.0,"boil_k":3273.0,"electronegativity":1.2,"electron_config":"[Xe] 4f7 5d1 6s2","discovered_by":"Jean Charles Galissard de Marignac","fun_fact":"Used as an MRI contrast agent.","summary":"Gadolinium is a chemical element with symbol Gd and atomic number 64. It is a silvery-white, malleable and ductile rare-earth metal. It is found in nature only in combined (salt) form."},{"number":65,"symbol":"Tb","name":"Terbium","category":"lanthanide","period":6,"group":3,"xpos":11,"ypos":9,"atomic_mass":158.925,"phase":"Solid","density":8.23,"melt_k":1629.0,"boil_k":3396.0,"electronegativity":1.1,"electron_config":"[Xe] 4f9 6s2","discovered_by":"Carl Gustaf Mosander","fun_fact":"Another Ytterby element; used in green phosphors.","summary":"Terbium is a chemical element with symbol Tb and atomic number 65. It is a silvery-white rare earth metal that is malleable, ductile and soft enough to be cut with a knife. Terbium is never found in nature as a free element, but it is contained in many minerals, including cerite, gadolinite, monazite, xenotime and euxenite."},{"number":66,"symbol":"Dy","name":"Dysprosium","category":"lanthanide","period":6,"group":3,"xpos":12,"ypos":9,"atomic_mass":162.5,"phase":"Solid","density":8.54,"melt_k":1680.0,"boil_k":2840.0,"electronegativity":1.22,"electron_config":"[Xe] 4f10 6s2","discovered_by":"Lecoq de Boisbaudran","fun_fact":"Its name means 'hard to get' in Greek.","summary":"Dysprosium is a chemical element with the symbol Dy and atomic number 66. It is a rare earth element with a metallic silver luster. Dysprosium is never found in nature as a free element, though it is found in various minerals, such as xenotime."},{"number":67,"symbol":"Ho","name":"Holmium","category":"lanthanide","period":6,"group":3,"xpos":13,"ypos":9,"atomic_mass":164.93,"phase":"Solid","density":8.79,"melt_k":1734.0,"boil_k":2873.0,"electronegativity":1.23,"electron_config":"[Xe] 4f11 6s2","discovered_by":"Marc Delafontaine","fun_fact":"Has the highest magnetic moment of any naturally occurring element.","summary":"Holmium is a chemical element with symbol Ho and atomic number 67. Part of the lanthanide series, holmium is a rare earth element. Holmium was discovered by Swedish chemist Per Theodor Cleve."},{"number":68,"symbol":"Er","name":"Erbium","category":"lanthanide","period":6,"group":3,"xpos":14,"ypos":9,"atomic_mass":167.259,"phase":"Solid","density":9.066,"melt_k":1802.0,"boil_k":3141.0,"electronegativity":1.24,"electron_config":"[Xe] 4f12 6s2","discovered_by":"Carl Gustaf Mosander","fun_fact":"Erbium-doped fibers amplify signals in undersea internet cables.","summary":"Erbium is a chemical element in the lanthanide series, with symbol Er and atomic number 68. A silvery-white solid metal when artificially isolated, natural erbium is always found in chemical combination with other elements on Earth. As such, it is a rare earth element which is associated with several other rare elements in the mineral gadolinite from Ytterby in Sweden, where yttrium, ytterbium, and terbium were discovered."},{"number":69,"symbol":"Tm","name":"Thulium","category":"lanthanide","period":6,"group":3,"xpos":15,"ypos":9,"atomic_mass":168.934,"phase":"Solid","density":9.32,"melt_k":1818.0,"boil_k":2223.0,"electronegativity":1.25,"electron_config":"[Xe] 4f13 6s2","discovered_by":"Per Teodor Cleve","fun_fact":"One of the least abundant rare earths.","summary":"Thulium is a chemical element with symbol Tm and atomic number 69. It is the thirteenth and antepenultimate (third-last) element in the lanthanide series. Like the other lanthanides, the most common oxidation state is +3, seen in its oxide, halides and other compounds."},{"number":70,"symbol":"Yb","name":"Ytterbium","category":"lanthanide","period":6,"group":3,"xpos":16,"ypos":9,"atomic_mass":173.045,"phase":"Solid","density":6.9,"melt_k":1097.0,"boil_k":1469.0,"electronegativity":1.1,"electron_config":"[Xe] 4f14 6s2","discovered_by":"Jean Charles Galissard de Marignac","fun_fact":"Ytterbium atomic clocks are among the most precise ever built.","summary":"Ytterbium is a chemical element with symbol Yb and atomic number 70. It is the fourteenth and penultimate element in the lanthanide series, which is the basis of the relative stability of its +2 oxidation state. However, like the other lanthanides, its most common oxidation state is +3, seen in its oxide, halides and other compounds."},{"number":71,"symbol":"Lu","name":"Lutetium","category":"lanthanide","period":6,"group":3,"xpos":17,"ypos":9,"atomic_mass":174.967,"phase":"Solid","density":9.841,"melt_k":1925.0,"boil_k":3675.0,"electronegativity":1.27,"electron_config":"[Xe] 4f14 5d1 6s2","discovered_by":"Georges Urbain","fun_fact":"The densest and hardest of the lanthanides.","summary":"Lutetium is a chemical element with symbol Lu and atomic number 71. It is a silvery white metal, which resists corrosion in dry, but not in moist air. It is considered the first element of the 6th-period transition metals and the last element in the lanthanide series, and is traditionally counted among the rare earths."},{"number":72,"symbol":"Hf","name":"Hafnium","category":"transition metal","period":6,"group":4,"xpos":4,"ypos":6,"atomic_mass":178.492,"phase":"Solid","density":13.31,"melt_k":2506.0,"boil_k":4876.0,"electronegativity":1.3,"electron_config":"[Xe] 4f14 5d2 6s2","discovered_by":"Dirk Coster","fun_fact":"Hides in zirconium ores and was only found in 1923.","summary":"Hafnium is a chemical element with symbol Hf and atomic number 72. A lustrous, silvery gray, tetravalent transition metal, hafnium chemically resembles zirconium and is found in zirconium minerals. Its existence was predicted by Dmitri Mendeleev in 1869, though it was not identified until 1923, making it the penultimate stable element to be discovered (rhenium was identified two years later)."},{"number":73,"symbol":"Ta","name":"Tantalum","category":"transition metal","period":6,"group":5,"xpos":5,"ypos":6,"atomic_mass":180.948,"phase":"Solid","density":16.69,"melt_k":3290.0,"boil_k":5731.0,"electronegativity":1.5,"electron_config":"[Xe] 4f14 5d3 6s2","discovered_by":"Anders Gustaf Ekeberg","fun_fact":"Named after Tantalus; it barely 'drinks' acid. Used in phone capacitors.","summary":"Tantalum is a chemical element with symbol Ta and atomic number 73. Previously known as tantalium, its name comes from Tantalus, an antihero from Greek mythology. Tantalum is a rare, hard, blue-gray, lustrous transition metal that is highly corrosion-resistant."},{"number":74,"symbol":"W","name":"Tungsten","category":"transition metal","period":6,"group":6,"xpos":6,"ypos":6,"atomic_mass":183.841,"phase":"Solid","density":19.25,"melt_k":3695.0,"boil_k":6203.0,"electronegativity":2.36,"electron_config":"[Xe] 4f14 5d4 6s2","discovered_by":"Carl Wilhelm Scheele","fun_fact":"Has the highest melting point of any metal, about 3,422 °C.","summary":"Tungsten, also known as wolfram, is a chemical element with symbol W and atomic number 74. The word tungsten comes from the Swedish language tung sten, which directly translates to heavy stone. Its name in Swedish is volfram, however, in order to distinguish it from scheelite, which in Swedish is alternatively named tungsten."},{"number":75,"symbol":"Re","name":"Rhenium","category":"transition metal","period":6,"group":7,"xpos":7,"ypos":6,"atomic_mass":186.207,"phase":"Solid","density":21.02,"melt_k":3459.0,"boil_k":5869.0,"electronegativity":1.9,"electron_config":"[Xe] 4f14 5d5 6s2","discovered_by":"Masataka Ogawa","fun_fact":"One of the last stable elements to be discovered, in 1925.","summary":"Rhenium is a chemical element with symbol Re and atomic number 75. It is a silvery-white, heavy, third-row transition metal in group 7 of the periodic table. With an estimated average concentration of 1 part per billion (ppb), rhenium is one of the rarest elements in the Earth's crust."},{"number":76,"symbol":"Os","name":"Osmium","category":"transition metal","period":6,"group":8,"xpos":8,"ypos":6,"atomic_mass":190.233,"phase":"Solid","density":22.59,"melt_k":3306.0,"boil_k":5285.0,"electronegativity":2.2,"electron_config":"[Xe] 4f14 5d6 6s2","discovered_by":"Smithson Tennant","fun_fact":"The densest naturally occurring element.","summary":"Osmium (from Greek osme (ὀσμή) meaning \"smell\") is a chemical element with symbol Os and atomic number 76. It is a hard, brittle, bluish-white transition metal in the platinum group that is found as a trace element in alloys, mostly in platinum ores. Osmium is the densest naturally occurring element, with a density of 22.59 g/cm3."},{"number":77,"symbol":"Ir","name":"Iridium","category":"transition metal","period":6,"group":9,"xpos":9,"ypos":6,"atomic_mass":192.217,"phase":"Solid","density":22.56,"melt_k":2719.0,"boil_k":4403.0,"electronegativity":2.2,"electron_config":"[Xe] 4f14 5d7 6s2","discovered_by":"Smithson Tennant","fun_fact":"A global iridium-rich layer marks the dinosaur-killing asteroid impact.","summary":"Iridium is a chemical element with symbol Ir and atomic number 77. A very hard, brittle, silvery-white transition metal of the platinum group, iridium is generally credited with being the second densest element (after osmium) based on measured density, although calculations involving the space lattices of the elements show that iridium is denser. It is also the most corrosion-resistant metal, even at temperatures as high as 2000 °C. Although only certain molten salts and halogens are corrosive to solid iridium, finely divided iridium dust is much more reactive and can be flammable."},{"number":78,"symbol":"Pt","name":"Platinum","category":"transition metal","period":6,"group":10,"xpos":10,"ypos":6,"atomic_mass":195.085,"phase":"Solid","density":21.45,"melt_k":2041.4,"boil_k":4098.0,"electronegativity":2.28,"electron_config":"[Xe] 4f14 5d9 6s1","discovered_by":"Antonio de Ulloa","fun_fact":"Used in catalytic converters and the old international prototype kilogram.","summary":"Platinum is a chemical element with symbol Pt and atomic number 78. It is a dense, malleable, ductile, highly unreactive, precious, gray-white transition metal. Its name is derived from the Spanish term platina, which is literally translated into \"little silver\"."},{"number":79,"symbol":"Au","name":"Gold","category":"transition metal","period":6,"group":11,"xpos":11,"ypos":6,"atomic_mass":196.967,"phase":"Solid","density":19.3,"melt_k":1337.33,"boil_k":3243.0,"electronegativity":2.54,"electron_config":"[Xe] 4f14 5d10 6s1","discovered_by":"Middle East","fun_fact":"So malleable that one gram can be beaten into a sheet about a square meter.","summary":"Gold is a chemical element with symbol Au (from Latin:aurum) and atomic number 79. In its purest form, it is a bright, slightly reddish yellow, dense, soft, malleable and ductile metal. Chemically, gold is a transition metal and a group 11 element."},{"number":80,"symbol":"Hg","name":"Mercury","category":"transition metal","period":6,"group":12,"xpos":12,"ypos":6,"atomic_mass":200.592,"phase":"Liquid","density":13.534,"melt_k":234.321,"boil_k":629.88,"electronegativity":2.0,"electron_config":"[Xe] 4f14 5d10 6s2","discovered_by":"unknown, before 2000 BCE","fun_fact":"The only metal that is liquid at room temperature.","summary":"Mercury is a chemical element with symbol Hg and atomic number 80. It is commonly known as quicksilver and was formerly named hydrargyrum (/haɪˈdrɑːrdʒərəm/). A heavy, silvery d-block element, mercury is the only metallic element that is liquid at standard conditions for temperature and pressure; the only other element that is liquid under these conditions is bromine, though metals such as caesium, gallium, and rubidium melt just above room temperature."},{"number":81,"symbol":"Tl","name":"Thallium","category":"post-transition metal","period":6,"group":13,"xpos":13,"ypos":6,"atomic_mass":204.38,"phase":"Solid","density":11.85,"melt_k":577.0,"boil_k":1746.0,"electronegativity":1.62,"electron_config":"[Xe] 4f14 5d10 6s2 6p1","discovered_by":"William Crookes","fun_fact":"Highly toxic; once called 'the poisoner's poison'.","summary":"Thallium is a chemical element with symbol Tl and atomic number 81. This soft gray post-transition metal is not found free in nature. When isolated, it resembles tin, but discolors when exposed to air."},{"number":82,"symbol":"Pb","name":"Lead","category":"post-transition metal","period":6,"group":14,"xpos":14,"ypos":6,"atomic_mass":207.21,"phase":"Solid","density":11.34,"melt_k":600.61,"boil_k":2022.0,"electronegativity":1.87,"electron_config":"[Xe] 4f14 5d10 6s2 6p2","discovered_by":"Middle East","fun_fact":"The Romans used it for water pipes; 'plumbing' comes from plumbum.","summary":"Lead (/lɛd/) is a chemical element in the carbon group with symbol Pb (from Latin:plumbum) and atomic number 82. Lead is a soft, malleable and heavy post-transition metal. Metallic lead has a bluish-white color after being freshly cut, but it soon tarnishes to a dull grayish color when exposed to air."},{"number":83,"symbol":"Bi","name":"Bismuth","category":"post-transition metal","period":6,"group":15,"xpos":15,"ypos":6,"atomic_mass":208.98,"phase":"Solid","density":9.78,"melt_k":544.7,"boil_k":1837.0,"electronegativity":2.02,"electron_config":"[Xe] 4f14 5d10 6s2 6p3","discovered_by":"Claude François Geoffroy","fun_fact":"Its oxidized crystals form beautiful rainbow staircases; it is in Pepto-Bismol.","summary":"Bismuth is a chemical element with symbol Bi and atomic number 83. Bismuth, a pentavalent post-transition metal, chemically resembles arsenic and antimony. Elemental bismuth may occur naturally, although its sulfide and oxide form important commercial ores."},{"number":84,"symbol":"Po","name":"Polonium","category":"post-transition metal","period":6,"group":16,"xpos":16,"ypos":6,"atomic_mass":209.0,"phase":"Solid","density":9.196,"melt_k":527.0,"boil_k":1235.0,"electronegativity":2.0,"electron_config":"[Xe] 4f14 5d10 6s2 6p4","discovered_by":"Pierre Curie","fun_fact":"Discovered by Marie and Pierre Curie, named after Poland.","summary":"Polonium is a chemical element with symbol Po and atomic number 84, discovered in 1898 by Marie Curie and Pierre Curie. A rare and highly radioactive element with no stable isotopes, polonium is chemically similar to bismuth and tellurium, and it occurs in uranium ores. Applications of polonium are few."},{"number":85,"symbol":"At","name":"Astatine","category":"halogen","period":6,"group":17,"xpos":17,"ypos":6,"atomic_mass":210.0,"phase":"Solid","density":6.35,"melt_k":575.0,"boil_k":610.0,"electronegativity":2.2,"electron_config":"[Xe] 4f14 5d10 6s2 6p5","discovered_by":"Dale R. Corson","fun_fact":"Probably less than a gram of it exists in Earth's crust at any moment.","summary":"Astatine is a very rare radioactive chemical element with the chemical symbol At and atomic number 85. It occurs on Earth as the decay product of various heavier elements. All its isotopes are short-lived; the most stable is astatine-210, with a half-life of 8.1 hours."},{"number":86,"symbol":"Rn","name":"Radon","category":"noble gas","period":6,"group":18,"xpos":18,"ypos":6,"atomic_mass":222.0,"phase":"Gas","density":9.73,"melt_k":202.0,"boil_k":211.5,"electronegativity":2.2,"electron_config":"[Xe] 4f14 5d10 6s2 6p6","discovered_by":"Friedrich Ernst Dorn","fun_fact":"A radioactive gas that can build up in basements.","summary":"Radon is a chemical element with symbol Rn and atomic number 86. It is a radioactive, colorless, odorless, tasteless noble gas, occurring naturally as a decay product of radium. Its most stable isotope, 222Rn, has a half-life of 3.8 days."},{"number":87,"symbol":"Fr","name":"Francium","category":"alkali metal","period":7,"group":1,"xpos":1,"ypos":7,"atomic_mass":223.0,"phase":"Solid","density":1.87,"melt_k":300.0,"boil_k":950.0,"electronegativity":0.79,"electron_config":"[Rn] 7s1","discovered_by":"Marguerite Perey","fun_fact":"Extremely rare and short-lived; the last naturally occurring element found.","summary":"Francium is a chemical element with symbol Fr and atomic number 87. It used to be known as eka-caesium and actinium K. It is the second-least electronegative element, behind only caesium. Francium is a highly radioactive metal that decays into astatine, radium, and radon."},{"number":88,"symbol":"Ra","name":"Radium","category":"alkaline earth metal","period":7,"group":2,"xpos":2,"ypos":7,"atomic_mass":226.0,"phase":"Solid","density":5.5,"melt_k":1233.0,"boil_k":2010.0,"electronegativity":0.9,"electron_config":"[Rn] 7s2","discovered_by":"Pierre Curie","fun_fact":"Glowed on old watch dials before its dangers were understood.","summary":"Radium is a chemical element with symbol Ra and atomic number 88. It is the sixth element in group 2 of the periodic table, also known as the alkaline earth metals. Pure radium is almost colorless, but it readily combines with nitrogen (rather than oxygen) on exposure to air, forming a black surface layer of radium nitride (Ra3N2)."},{"number":89,"symbol":"Ac","name":"Actinium","category":"actinide","period":7,"group":3,"xpos":3,"ypos":10,"atomic_mass":227.0,"phase":"Solid","density":10.0,"melt_k":1500.0,"boil_k":3500.0,"electronegativity":1.1,"electron_config":"[Rn] 6d1 7s2","discovered_by":"Friedrich Oskar Giesel","fun_fact":"Glows blue in the dark from its radioactivity.","summary":"Actinium is a radioactive chemical element with symbol Ac (not to be confused with the abbreviation for an acetyl group) and atomic number 89, which was discovered in 1899. It was the first non-primordial radioactive element to be isolated. Polonium, radium and radon were observed before actinium, but they were not isolated until 1902."},{"number":90,"symbol":"Th","name":"Thorium","category":"actinide","period":7,"group":3,"xpos":4,"ypos":10,"atomic_mass":232.038,"phase":"Solid","density":11.724,"melt_k":2023.0,"boil_k":5061.0,"electronegativity":1.3,"electron_config":"[Rn] 6d2 7s2","discovered_by":"Jöns Jakob Berzelius","fun_fact":"Possible fuel for future nuclear reactors; named after Thor.","summary":"Thorium is a chemical element with symbol Th and atomic number 90. A radioactive actinide metal, thorium is one of only two significantly radioactive elements that still occur naturally in large quantities as a primordial element (the other being uranium). It was discovered in 1828 by the Norwegian Reverend and amateur mineralogist Morten Thrane Esmark and identified by the Swedish chemist Jöns Jakob Berzelius, who named it after Thor, the Norse god of thunder."},{"number":91,"symbol":"Pa","name":"Protactinium","category":"actinide","period":7,"group":3,"xpos":5,"ypos":10,"atomic_mass":231.036,"phase":"Solid","density":15.37,"melt_k":1841.0,"boil_k":4300.0,"electronegativity":1.5,"electron_config":"[Rn] 5f2 6d1 7s2","discovered_by":"William Crookes","fun_fact":"Among the rarest and most expensive naturally occurring elements.","summary":"Protactini
